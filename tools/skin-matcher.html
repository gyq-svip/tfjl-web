<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮肤截图批量匹配工具</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.5;
        }
        h1 { font-size: 1.3rem; margin: 16px 20px 8px; color: #ffd700; }
        h2 { font-size: 1rem; margin: 0 0 10px; word-break: break-all; }
        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 10px 20px;
        }
        .panel h3 { margin: 0 0 10px; font-size: 0.95rem; color: #4cc9f0; }
        .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
        .row:last-child { margin-bottom: 0; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type="text"], select, textarea {
            background: #0f3460;
            color: #fff;
            border: 1px solid #2a4d7c;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.9rem;
        }
        input[type="file"] { color: #ddd; font-size: 0.85rem; max-width: 320px; }
        button {
            background: #4361ee;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background: #3a56d4; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        button.primary { background: #f72585; }
        button.primary:hover { background: #d91a6d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { font-size: 0.8rem; color: #999; margin-top: 4px; }
        .error { color: #ff6b6b; font-size: 0.85rem; }
        .success { color: #51cf66; font-size: 0.85rem; }

        #workspace { display: none; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #16213e;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .viewer {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 14px 20px;
        }
        .preview-wrap {
            flex: 1 1 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1020;
            border-radius: 10px;
            min-height: 320px;
            overflow: hidden;
            border: 2px solid #2a2a4a;
        }
        .preview-wrap img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        .side-panel {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .side-panel label { display: flex; flex-direction: column; gap: 4px; }
        .side-panel select, .side-panel input[type="text"] { width: 100%; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .actions button { flex: 1 1 auto; }
        .exports { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
        .exports button { width: 100%; }

        #thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 6px;
            padding: 12px 20px 30px;
            max-height: 220px;
            overflow-y: auto;
        }
        .thumb {
            position: relative;
            aspect-ratio: 1;
            background: #0f1020;
            border: 2px solid #2a2a4a;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.7;
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb.current { border-color: #4cc9f0; opacity: 1; }
        .thumb.mapped { border-color: #51cf66; opacity: 1; }
        .thumb.skipped { border-color: #ff6b6b; opacity: 1; }
        .thumb.hidden-thumb { display: none; }
        .thumb .idx {
            position: absolute;
            top: 2px;
            left: 2px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .path-inputs { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .path-inputs input { width: 100%; }

        @media (max-width: 720px) {
            .side-panel { flex: 1 1 100%; }
            .preview-wrap { min-height: 240px; }
        }
    </style>
</head>
<body>
    <h1>皮肤截图批量匹配工具</h1>

    <div id="setupPanel">
        <div class="panel">
            <h3>① 加载皮肤注册表（registry.json）</h3>
            <div class="row">
                <button id="fetchRegistryBtn">从线上拉取默认 registry</button>
                <span class="hint">来源：https://gyq-svip.github.io/tfjl-web/skins/registry.json</span>
            </div>
            <div class="row">
                <label>或粘贴 JSON：</label>
            </div>
            <textarea id="registryJson" rows="6" style="width:100%; font-family: monospace;" placeholder='{"version":1,"heroes":{"女王":[{"name":"任盈盈","file":"任盈盈.jpg"}]}}'></textarea>
            <div class="row">
                <button id="parseRegistryBtn" class="secondary">解析粘贴的 JSON</button>
                <span id="registryStatus" class="hint"></span>
            </div>
        </div>

        <div class="panel">
            <h3>② 选择截图文件夹</h3>
            <div class="row">
                <input type="file" id="imageInput" webkitdirectory directory multiple accept="image/*">
            </div>
            <div class="hint">截图请按数字命名（如 1.png、2.png …），工具会按数字排序。</div>
        </div>

        <div class="panel">
            <h3>③ 继续上次的进度（可选）</h3>
            <div class="row">
                <input type="file" id="mappingInput" accept=".json">
                <button id="loadMappingBtn" class="secondary">导入映射 JSON</button>
            </div>
            <div class="hint">自动保存到浏览器本地，换浏览器/清缓存需手动导入。</div>
        </div>

        <div class="panel">
            <h3>④ 设置重命名输出路径</h3>
            <div class="path-inputs">
                <label>截图所在文件夹（PowerShell 路径，如 C:\screenshots）</label>
                <input type="text" id="sourceDir" placeholder="C:\screenshots">
                <label>输出到（会按 skins\英雄名 自动建子目录）</label>
                <input type="text" id="outputDir" placeholder="C:\output\skins">
            </div>
        </div>

        <div class="row" style="margin: 0 20px;">
            <button id="startBtn" class="primary" disabled>开始匹配</button>
            <span id="startHint" class="hint">请先加载注册表和截图文件夹</span>
        </div>
    </div>

    <div id="workspace">
        <div class="topbar">
            <span id="progressText">0 / 0</span>
            <span id="statsText" style="font-size:0.8rem;opacity:0.7;"></span>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.85rem;">
                <input type="checkbox" id="hideMatched" checked> 隐藏已匹配
            </label>
            <button id="stopBtn" class="secondary" style="font-size:0.8rem;padding:4px 10px;">停止匹配</button>
            <span id="statusText"></span>
        </div>
        <div class="viewer">
            <div class="preview-wrap">
                <img id="preview" src="" alt="预览">
            </div>
            <div class="side-panel">
                <h2 id="fileName">-</h2>
                <label>
                    职业筛选
                    <select id="professionFilter">
                        <option value="">全部职业</option>
                        <option value="战士">⚔️ 战士</option>
                        <option value="法师">🔮 法师</option>
                        <option value="射手">🏹 射手</option>
                        <option value="召唤">🐉 召唤</option>
                        <option value="牧师">💚 牧师</option>
                        <option value="术士">🌑 术士</option>
                        <option value="熊猫">🐼 熊猫</option>
                        <option value="工程">⚙️ 工程</option>
                        <option value="精灵">🔴 精灵</option>
                    </select>
                </label>
                <label>
                    英雄
                    <input type="text" id="heroSearch" placeholder="搜英雄（拼音首字母/汉字），如 sl=水灵、战=战士" autocomplete="off" style="margin-bottom:4px;">
                    <select id="heroSelect" size="8" style="height:auto;"></select>
                </label>
                <label>
                    皮肤
                    <select id="skinSelect"></select>
                </label>
                <label>
                    自定义文件名（可选，留空用皮肤名）
                    <input type="text" id="customName" placeholder="例如：任盈盈_冰雪">
                </label>

                <div class="actions">
                    <button id="prevBtn">上一张 (←)</button>
                    <button id="skipBtn" class="secondary">跳过 (Del)</button>
                    <button id="saveBtn" class="primary">保存并下一张 (Enter)</button>
                    <button id="nextBtn">下一张 (→)</button>
                </div>

                <div class="exports">
                    <button id="exportJsonBtn" class="secondary">导出映射 JSON</button>
                    <button id="exportPsBtn" class="secondary">导出 PowerShell 重命名脚本</button>
                    <button id="clearProgressBtn" class="secondary">清除本地进度</button>
                </div>
            </div>
        </div>
        <div id="thumbnails"></div>
    </div>

    <script>
        const DEFAULT_REGISTRY_URL = 'https://gyq-svip.github.io/tfjl-web/skins/registry.json';
        const LOCAL_KEY = 'skinMatcher_progress_v1';
        const IMAGE_EXTS = /\.(png|jpe?g|gif|webp|bmp)$/i;

        // 英雄→职业映射表
        const HERO_PROFESSION = {
            "天使": "牧师","圣骑": "牧师","死神": "牧师","酋长": "牧师","咕咕": "牧师","小野": "牧师",
            "鲛女": "牧师","巫医": "牧师","小鹿":"牧师","大树":"牧师","猫咪":"牧师","萨满":"牧师",
            "地精":"牧师","工匠":"牧师",
            "鱼人":"战士","战将":"战士","刀客":"战士","霸王":"战士","亡将":"战士","铁骑":"战士",
            "石头":"战士","神龛":"战士","刺客":"战士","钢鬃":"战士","恶匪":"战士","斧客":"战士",
            "剑客":"战士","龙拳":"战士","狂将":"战士","孤星":"战士","领主":"战士","狂龙":"战士",
            "电法":"法师","小丑":"法师","女王":"法师","沙皇":"法师","飞机":"法师","炎魔":"法师",
            "火法":"法师","暗法":"法师","冰法":"法师","凤凰":"法师","火神":"法师","阿翼":"法师",
            "龟相":"法师","谜云":"法师","雷神":"法师","女妖":"法师","冰鸟":"法师",
            "蛇女":"射手","虎弓":"射手","后羿":"射手","海妖":"射手","骨弓":"射手",
            "小炮":"射手","爱神":"射手","船长":"射手","毒王":"射手","炸弹":"射手",
            "火枪":"射手","松鼠":"射手","绿弓":"射手","蜘蛛":"射手","冰弓":"射手",
            "风灵":"熊猫","火灵":"熊猫","水灵":"熊猫","萌萌":"熊猫","土灵":"熊猫",
            "射线":"工程","宝库":"工程","潜艇":"工程","火炮":"工程","咬人娃娃":"工程",
            "影":"术士","魇":"术士","葵":"术士","傀":"术士","邪":"术士","大圣":"术士","闪":"术士",
            "龙王":"召唤","钟馗":"召唤","悟空":"召唤","冰骑":"召唤","恶魔":"召唤",
            "幽灵":"召唤","神龙":"召唤","骨龙":"召唤","祭司":"召唤",
            "土精灵":"精灵","彩精灵":"精灵","魔精灵":"精灵","木精灵":"精灵",
            "光精灵":"精灵","幻精灵":"精灵","雷精灵":"精灵","冰精灵":"精灵",
            "暗精灵":"精灵","魂精灵":"精灵"
        };

        // 英雄→拼音首字母映射（用于搜索框快速定位）
        const HERO_PINYIN = {
            "天使":"ts","圣骑":"sq","死神":"ss","酋长":"qz","咕咕":"gg","小野":"xy",
            "鲛女":"jn","巫医":"wy","小鹿":"xl","大树":"ds","猫咪":"mm","萨满":"sm",
            "地精":"dj","工匠":"gj","鱼人":"yr","战将":"zj","刀客":"dk","霸王":"bw",
            "亡将":"wj","铁骑":"tq","石头":"st","神龛":"sk","刺客":"ck","钢鬃":"gz",
            "恶匪":"ef","斧客":"fk","剑客":"jk","龙拳":"lq","狂将":"kj","孤星":"gx",
            "领主":"lz","狂龙":"kl","电法":"df","小丑":"xc","女王":"nw","沙皇":"sh",
            "飞机":"fj","炎魔":"ym","火法":"hf","暗法":"af","冰法":"bf","凤凰":"fh",
            "火神":"hs","阿翼":"ay","龟相":"gv","谜云":"my","雷神":"ls","女妖":"ny",
            "冰鸟":"bn","蛇女":"sn","虎弓":"hg","后羿":"hy","海妖":"ha","小炮":"xp",
            "爱神":"as","船长":"cz","毒王":"dw","炸弹":"zd","火枪":"hq","松鼠":"shu",
            "绿弓":"lg","蜘蛛":"zz","冰弓":"bg","风灵":"fl","火灵":"hl","水灵":"sl",
            "萌萌":"mem","土灵":"tl","射线":"sx","宝库":"bk","潜艇":"qt","火炮":"hp",
            "咬人娃娃":"yrww","影":"y","魇":"ye","葵":"kui","傀":"kui2","邪":"xie",
            "大圣":"das","闪":"shan","龙王":"lw","钟馗":"zk","悟空":"wk","冰骑":"bq",
            "恶魔":"em","幽灵":"yl","神龙":"snl","骨龙":"gl","祭司":"js",
            "土精灵":"tjl","彩精灵":"cjl","魔精灵":"mjl","木精灵":"mujl","光精灵":"gjl",
            "幻精灵":"hjl","雷精灵":"ljl","冰精灵":"bjl","暗精灵":"ajl","魂精灵":"hunjl"
        };

        let registry = { heroes: {} };
        let files = [];
        let mappings = [];
        let currentIdx = 0;
        let previewUrl = null;

        const $ = id => document.getElementById(id);

        // 自然排序：先按前导数字，再按字符串
        function naturalCompare(a, b) {
            const na = parseInt(a.name.match(/^\d+/)?.[0] || '0', 10);
            const nb = parseInt(b.name.match(/^\d+/)?.[0] || '0', 10);
            if (na !== nb) return na - nb;
            return a.name.localeCompare(b.name, undefined, { numeric: true });
        }

        function setStatus(el, text, isError) {
            el.textContent = text;
            el.className = isError ? 'error' : 'success';
        }

        function parseRegistryJson(text) {
            try {
                const data = JSON.parse(text);
                if (!data || typeof data !== 'object' || !data.heroes || typeof data.heroes !== 'object') {
                    throw new Error('JSON 格式不对：缺少 heroes 字段');
                }
                registry = data;
                populateHeroSelect();
                setStatus($('registryStatus'), `已解析：${Object.keys(registry.heroes).length} 位英雄`, false);
                checkStartReady();
                return true;
            } catch (e) {
                setStatus($('registryStatus'), '解析失败：' + e.message, true);
                return false;
            }
        }

        function populateHeroSelect() {
            const sel = $('heroSelect');
            const filterProf = $('professionFilter').value;
            const searchText = ($('heroSearch').value || '').trim().toLowerCase();
            sel.innerHTML = '<option value="">-- 请选择英雄 --</option>';
            const heroes = Object.keys(registry.heroes).sort();
            let count = 0;
            for (const h of heroes) {
                // 职业筛选
                if (filterProf && HERO_PROFESSION[h] !== filterProf) continue;
                // 搜索筛选：匹配英雄名（汉字）或拼音首字母
                if (searchText) {
                    const py = (HERO_PINYIN[h] || '').toLowerCase();
                    const nameMatch = h.includes(searchText);
                    const pyMatch = py && py.includes(searchText);
                    if (!nameMatch && !pyMatch) continue;
                }
                const opt = document.createElement('option');
                opt.value = h;
                // 显示数量：总皮肤数 / 已匹配数（如有）
                const matchedCount = mappings.filter(m => m && m.hero === h && !m.skipped).length;
                const totalCount = registry.heroes[h].length;
                if (matchedCount > 0) {
                    opt.textContent = `${h}（${totalCount}，已配${matchedCount}）`;
                } else {
                    opt.textContent = `${h}（${totalCount}）`;
                }
                sel.appendChild(opt);
                count++;
            }
            if (count === 0 && searchText) {
                sel.innerHTML = '<option value="">-- 无匹配英雄 --</option>';
            } else if (count === 0 && filterProf) {
                sel.innerHTML = '<option value="">-- 该职业无英雄 --</option>';
            }
            // 根据结果数量调整 size
            sel.size = Math.max(2, Math.min(count + 1, 12));
            updateSkinOptions();
        }

        function updateSkinOptions() {
            const hero = $('heroSelect').value;
            const sel = $('skinSelect');
            sel.innerHTML = '<option value="">-- 请选择皮肤 --</option>';
            if (!hero || !registry.heroes[hero]) return;
            // 收集当前批次已用过的 (hero, skin) 对
            const usedSkins = new Set();
            mappings.forEach(m => {
                if (m && m.hero === hero && m.skin && !m.skipped) {
                    usedSkins.add(m.skin);
                }
            });
            const skins = registry.heroes[hero];
            let available = 0;
            for (const s of skins) {
                const opt = document.createElement('option');
                opt.value = s.name;
                if (usedSkins.has(s.name)) {
                    opt.textContent = `✓ ${s.name}（已配）`;
                    opt.style.color = '#51cf66';
                    opt.style.opacity = '0.6';
                } else {
                    opt.textContent = s.name;
                    available++;
                }
                sel.appendChild(opt);
            }
        }

        $('fetchRegistryBtn').addEventListener('click', async () => {
            setStatus($('registryStatus'), '正在拉取…', false);
            try {
                const resp = await fetch(DEFAULT_REGISTRY_URL, { cache: 'no-cache' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const text = await resp.text();
                $('registryJson').value = text;
                parseRegistryJson(text);
            } catch (e) {
                setStatus($('registryStatus'), '拉取失败：' + e.message, true);
            }
        });

        $('parseRegistryBtn').addEventListener('click', () => {
            parseRegistryJson($('registryJson').value.trim());
        });

        $('heroSelect').addEventListener('change', updateSkinOptions);

        // 搜索框实时过滤英雄列表
        $('heroSearch').addEventListener('input', () => {
            const prevHero = $('heroSelect').value;
            populateHeroSelect();
            if (prevHero && [...$('heroSelect').options].some(o => o.value === prevHero)) {
                $('heroSelect').value = prevHero;
                updateSkinOptions();
            }
        });

        $('professionFilter').addEventListener('change', () => {
            // 保存当前选择的英雄
            const prevHero = $('heroSelect').value;
            populateHeroSelect();
            // 如果之前选的英雄还在列表中，恢复选择
            if (prevHero && [...$('heroSelect').options].some(o => o.value === prevHero)) {
                $('heroSelect').value = prevHero;
                updateSkinOptions();
            }
        });

        $('imageInput').addEventListener('change', e => {
            const all = Array.from(e.target.files || []);
            files = all.filter(f => IMAGE_EXTS.test(f.name)).sort(naturalCompare);
            mappings = files.map(() => null);
            $('startHint').textContent = `已选择 ${files.length} 张图片`;
            checkStartReady();
        });

        function checkStartReady() {
            const ready = Object.keys(registry.heroes).length > 0 && files.length > 0;
            $('startBtn').disabled = !ready;
            if (ready) {
                $('startHint').textContent = `注册表 + ${files.length} 张图片已就绪，点击开始匹配`;
            }
        }

        $('startBtn').addEventListener('click', () => {
            // 尝试恢复本地进度
            loadLocalProgress();
            $('setupPanel').style.display = 'none';
            $('workspace').style.display = 'block';
            renderThumbnails();
            // 恢复上次中断的位置，或跳到第一个待匹配项（如果开启隐藏已匹配）
            let startIdx = 0;
            if (savedResumeIdx >= 0) {
                if (isHidden(savedResumeIdx)) {
                    // 上次停的图已经匹配了，找下一个未处理的
                    let found = -1;
                    for (let i = savedResumeIdx; i < files.length; i++) {
                        if (!isHidden(i)) { found = i; break; }
                    }
                    startIdx = found >= 0 ? found : savedResumeIdx;
                } else {
                    startIdx = savedResumeIdx;
                }
            }
            goTo(startIdx);
            savedResumeIdx = -1;
        });

        let savedResumeIdx = -1; // 上次停在哪张图
        function loadLocalProgress() {
            try {
                const raw = localStorage.getItem(LOCAL_KEY);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (!saved || !Array.isArray(saved.mappings) || !Array.isArray(saved.filesMeta)) return;
                // 按当前文件顺序匹配
                const mapByName = new Map();
                saved.filesMeta.forEach((name, i) => {
                    mapByName.set(name, saved.mappings[i]);
                });
                mappings = files.map(f => mapByName.get(f.name) || null);
                if (saved.sourceDir) $('sourceDir').value = saved.sourceDir;
                if (saved.outputDir) $('outputDir').value = saved.outputDir;
                // 记住上次位置，下次恢复时跳过去
                savedResumeIdx = (saved.currentIdx != null && saved.currentIdx >= 0 && saved.currentIdx < files.length)
                    ? saved.currentIdx : -1;
            } catch (e) {
                console.warn('恢复本地进度失败', e);
            }
        }

        function saveLocalProgress() {
            try {
                const payload = {
                    registry,
                    filesMeta: files.map(f => f.name),
                    mappings,
                    currentIdx,
                    sourceDir: $('sourceDir').value.trim(),
                    outputDir: $('outputDir').value.trim(),
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem(LOCAL_KEY, JSON.stringify(payload));
            } catch (e) {
                console.warn('保存本地进度失败', e);
            }
        }

        function goTo(idx) {
            if (idx < 0) idx = 0;
            if (idx >= files.length) idx = files.length - 1;
            // 隐藏已匹配模式下：跳过已匹配/跳过的项
            if (isHidden(idx)) {
                let found = -1;
                for (let i = idx + 1; i < files.length; i++) {
                    if (!isHidden(i)) { found = i; break; }
                }
                if (found === -1) {
                    for (let i = idx - 1; i >= 0; i--) {
                        if (!isHidden(i)) { found = i; break; }
                    }
                }
                if (found === -1) {
                    $('statusText').textContent = '🎉 全部已匹配！';
                    saveLocalProgress();
                    return;
                }
                idx = found;
            }
            currentIdx = idx;
            renderCurrent();
            updateThumbHighlight();
            saveCurrentSelection();
            saveLocalProgress();
        }

        function renderCurrent() {
            const f = files[currentIdx];
            if (!f) return;
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(f);
            $('preview').src = previewUrl;
            $('fileName').textContent = f.name;

            const visibleCount = files.filter((_, i) => !isHidden(i)).length;
            const matchedCount = mappings.filter(m => m && m.hero).length;
            const skippedCount = mappings.filter(m => m && m.skipped).length;
            const remainCount = files.length - matchedCount - skippedCount;
            $('progressText').textContent = `${currentIdx + 1} / ${files.length}`;
            $('statsText').textContent = `已匹配${matchedCount} | 跳过${skippedCount} | 剩余${remainCount}`;

            const m = mappings[currentIdx];
            if (m && !m.skipped) {
                $('heroSelect').value = m.hero || '';
                updateSkinOptions();
                $('skinSelect').value = m.skin || '';
                $('customName').value = m.custom || '';
            } else {
                // 尝试恢复临时选择
                restoreCurrentSelection();
            }

            const status = m?.skipped ? '已跳过' : (m && m.hero ? `已映射：${m.hero} / ${m.skin || '?'}` : '未匹配');
            $('statusText').textContent = status;
        }

        // === 隐藏已匹配 ===
        function isHidden(idx) {
            if (!$('hideMatched').checked) return false;
            const m = mappings[idx];
            return m && (m.hero || m.skipped);
        }

        // === 实时自动保存当前选择（带 idx 校验） ===
        function saveCurrentSelection() {
            try {
                const m = mappings[currentIdx];
                if (m && m.hero) return; // 已保存的，不覆盖草稿
                const sel = {
                    hero: $('heroSelect').value,
                    skin: $('skinSelect').value,
                    custom: $('customName').value.trim(),
                    idx: currentIdx,
                    fileName: files[currentIdx]?.name || ''
                };
                localStorage.setItem(LOCAL_KEY + '_currentSel', JSON.stringify(sel));
            } catch (e) {}
        }

        function restoreCurrentSelection() {
            try {
                const raw = localStorage.getItem(LOCAL_KEY + '_currentSel');
                if (!raw) return;
                const sel = JSON.parse(raw);
                // 只有同一张卡才恢复草稿
                if (sel.idx !== currentIdx) return;
                if (sel.fileName !== (files[currentIdx]?.name || '')) return;
                $('heroSelect').value = sel.hero || '';
                updateSkinOptions();
                setTimeout(() => { $('skinSelect').value = sel.skin || ''; }, 50);
                $('customName').value = sel.custom || '';
                localStorage.removeItem(LOCAL_KEY + '_currentSel');
            } catch (e) {}
        }

        // 选择变化时实时保存
        const selectionEls = ['heroSelect', 'skinSelect', 'customName'];
        selectionEls.forEach(id => {
            $(id).addEventListener('change', saveCurrentSelection);
            $(id).addEventListener('input', saveCurrentSelection);
        });

        function renderThumbnails() {
            const box = $('thumbnails');
            box.innerHTML = '';
            files.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'thumb';
                div.dataset.idx = i;
                if (isHidden(i)) div.classList.add('hidden-thumb');
                const img = document.createElement('img');
                img.src = URL.createObjectURL(f);
                div.appendChild(img);
                const badge = document.createElement('span');
                badge.className = 'idx';
                badge.textContent = i + 1;
                div.appendChild(badge);
                div.addEventListener('click', () => goTo(i));
                box.appendChild(div);
            });
        }

        function updateThumbHighlight() {
            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(t => {
                const i = parseInt(t.dataset.idx, 10);
                t.classList.remove('current', 'mapped', 'skipped', 'hidden-thumb');
                if (isHidden(i)) t.classList.add('hidden-thumb');
                if (i === currentIdx) t.classList.add('current');
                const m = mappings[i];
                if (m) {
                    t.classList.add(m.skipped ? 'skipped' : 'mapped');
                }
            });
        }

        function saveAndNext() {
            const hero = $('heroSelect').value;
            const skin = $('skinSelect').value;
            if (!hero || !skin) {
                $('statusText').textContent = '请先选择英雄和皮肤';
                return;
            }
            mappings[currentIdx] = {
                hero,
                skin,
                custom: $('customName').value.trim()
            };
            localStorage.removeItem(LOCAL_KEY + '_currentSel');
            updateThumbHighlight();
            updateSkinOptions(); // 立即刷新皮肤下拉框（标记已用皮肤）
            updateHeroCountDisplay(); // 更新英雄下拉框已配数量
            saveLocalProgress();
            goToNext();
        }

        // 更新当前选中英雄的已配数量（不重建整个下拉框）
        function updateHeroCountDisplay() {
            const hero = $('heroSelect').value;
            if (!hero) return;
            const sel = $('heroSelect');
            for (const opt of sel.options) {
                if (opt.value === hero) {
                    const matchedCount = mappings.filter(m => m && m.hero === hero && !m.skipped).length;
                    const totalCount = registry.heroes[hero] ? registry.heroes[hero].length : 0;
                    if (matchedCount > 0) {
                        opt.textContent = `${hero}（${totalCount}，已配${matchedCount}）`;
                    } else {
                        opt.textContent = `${hero}（${totalCount}）`;
                    }
                    break;
                }
            }
        }

        function skipAndNext() {
            mappings[currentIdx] = { skipped: true };
            localStorage.removeItem(LOCAL_KEY + '_currentSel');
            updateThumbHighlight();
            saveLocalProgress();
            goToNext();
        }

        function goToNext() {
            // 找下一个未隐藏的项
            let next = currentIdx + 1;
            while (next < files.length && isHidden(next)) {
                next++;
            }
            if (next < files.length) {
                goTo(next);
            } else {
                $('statusText').textContent = '🎉 全部已匹配！';
                renderCurrent();
                updateThumbHighlight();
                saveLocalProgress();
            }
        }

        $('saveBtn').addEventListener('click', saveAndNext);
        $('skipBtn').addEventListener('click', skipAndNext);
        $('prevBtn').addEventListener('click', () => goTo(currentIdx - 1));
        $('nextBtn').addEventListener('click', () => goTo(currentIdx + 1));

        document.addEventListener('keydown', e => {
            if ($('workspace').style.display === 'none') return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
            if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIdx + 1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIdx - 1); }
            else if (e.key === 'Enter') { e.preventDefault(); saveAndNext(); }
            else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); skipAndNext(); }
        });

        // 导入映射 JSON
        $('loadMappingBtn').addEventListener('click', () => {
            const input = $('mappingInput');
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!data.mappings || !Array.isArray(data.mappings)) throw new Error('缺少 mappings 数组');
                    const mapByName = new Map();
                    (data.filesMeta || []).forEach((name, i) => {
                        mapByName.set(name, data.mappings[i]);
                    });
                    mappings = files.map(f => mapByName.get(f.name) || null);
                    if (data.sourceDir) $('sourceDir').value = data.sourceDir;
                    if (data.outputDir) $('outputDir').value = data.outputDir;
                    saveLocalProgress();
                    renderThumbnails();
                    updateThumbHighlight();
                    if ($('workspace').style.display !== 'none') renderCurrent();
                    setStatus($('startHint'), '已导入映射', false);
                } catch (e) {
                    setStatus($('startHint'), '导入失败：' + e.message, true);
                }
            };
            reader.readAsText(input.files[0]);
        });

        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
        }

        $('exportJsonBtn').addEventListener('click', () => {
            const data = {
                version: 1,
                createdAt: new Date().toISOString(),
                sourceDir: $('sourceDir').value.trim(),
                outputDir: $('outputDir').value.trim(),
                filesMeta: files.map(f => f.name),
                mappings
            };
            downloadBlob(JSON.stringify(data, null, 2), 'skin-mapping.json', 'application/json');
        });

        function getFileExt(name) {
            const m = name.match(/\.[^.]+$/);
            return m ? m[0] : '.png';
        }

        function safeFileName(name) {
            return name.replace(/[\\/:*?"<>|]/g, '_');
        }

        $('exportPsBtn').addEventListener('click', () => {
            const src = $('sourceDir').value.trim() || 'C:\\screenshots';
            const dst = $('outputDir').value.trim() || 'C:\\output\\skins';
            const lines = [
                '# 皮肤截图批量重命名脚本',
                '# 生成时间：' + new Date().toLocaleString(),
                `$sourceDir = "${src.replace(/"/g, '\\"')}"`,
                `$outputDir = "${dst.replace(/"/g, '\\"')}"`,
                'New-Item -ItemType Directory -Force -Path $outputDir | Out-Null',
                ''
            ];
            let moved = 0;
            for (let i = 0; i < files.length; i++) {
                const m = mappings[i];
                if (!m || m.skipped) continue;
                const srcName = files[i].name;
                const ext = getFileExt(srcName);
                const heroDir = safeFileName(m.hero);
                const skinName = safeFileName(m.custom || m.skin);
                const targetName = `${skinName}${ext}`;
                lines.push(`# ${srcName} -> ${heroDir}/${targetName}`);
                lines.push(`New-Item -ItemType Directory -Force -Path (Join-Path $outputDir "${heroDir}") | Out-Null`);
                lines.push(`Move-Item -Path (Join-Path $sourceDir "${srcName}") -Destination (Join-Path (Join-Path $outputDir "${heroDir}") "${targetName}") -ErrorAction SilentlyContinue`);
                lines.push('');
                moved++;
            }
            lines.push(`Write-Host "完成：共处理 ${moved} 张图片"`);
            downloadBlob(lines.join("\r\n"), 'rename-skins.ps1', 'text/plain');
        });

        $('clearProgressBtn').addEventListener('click', () => {
            if (!confirm('确定清除本地保存的进度？（已导出的 JSON 不受影响）')) return;
            localStorage.removeItem(LOCAL_KEY);
            mappings = files.map(() => null);
            renderThumbnails();
            renderCurrent();
        });

        // 停止匹配，回到设置面板（进度已自动保存）
        $('stopBtn').addEventListener('click', () => {
            saveLocalProgress();
            saveCurrentSelection();
            $('workspace').style.display = 'none';
            $('setupPanel').style.display = 'block';
            $('startHint').textContent = `进度已保存（${files.length} 张图片），点击"开始匹配"可继续`;
        });

        // 隐藏已匹配切换
        $('hideMatched').addEventListener('change', () => {
            updateThumbHighlight();
            if (isHidden(currentIdx)) {
                let found = -1;
                for (let i = 0; i < files.length; i++) {
                    if (!isHidden(i)) { found = i; break; }
                }
                if (found >= 0) {
                    currentIdx = found;
                    renderCurrent();
                    updateThumbHighlight();
                }
            } else {
                renderCurrent(); // 刷新统计
            }
            saveCurrentSelection();
        });

        // 页面关闭前保存
        window.addEventListener('beforeunload', saveLocalProgress);
        window.addEventListener('beforeunload', saveCurrentSelection);
    </script>
</body>
</html>
