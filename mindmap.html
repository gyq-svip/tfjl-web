<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>功能导览 - 塔防精灵助手</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
        overflow-x: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container { position: relative; min-width: 1100px; min-height: 850px; }

    /* 返回按钮 */
    .back-btn {
        position: fixed; top: 16px; left: 16px; z-index: 10;
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.4);
        color: #ffd700; padding: 8px 18px; border-radius: 8px;
        cursor: pointer; font-size: 0.85rem; font-weight: 600;
        text-decoration: none; transition: all 0.3s;
        backdrop-filter: blur(8px);
    }
    .back-btn:hover { background: rgba(255,215,0,0.2); border-color: #ffd700; }

    /* 标题 */
    .page-title {
        position: fixed; top: 16px; right: 30px; z-index: 10;
        color: rgba(255,255,255,0.7); font-size: 0.85rem;
    }

    svg { display: block; }

    /* 节点组样式 */
    .node-group { cursor: pointer; }
    .node-group:hover .node-rect { filter: brightness(1.2); }
    .node-group:hover .node-text { font-weight: 700; }

    .conn-line {
        fill: none;
        stroke-width: 2.5;
        opacity: 0.6;
        transition: all 0.3s;
    }
    .node-rect {
        transition: all 0.25s ease;
    }
    .node-text {
        transition: all 0.25s ease;
        pointer-events: none;
    }

    /* 图例 */
    .legend {
        position: fixed; bottom: 20px; right: 30px; z-index: 10;
        display: flex; gap: 24px;
    }
    .legend-item {
        display: flex; align-items: center; gap: 8px;
        color: rgba(255,255,255,0.7); font-size: 0.78rem;
    }
    .legend-dot {
        width: 12px; height: 12px; border-radius: 50%;
        box-shadow: 0 0 8px currentColor;
    }

    /* 提示 */
    .hint {
        position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 10;
        color: rgba(255,255,255,0.4); font-size: 0.75rem;
    }
</style>
</head>
<body>

<a class="back-btn" href="https://gyq-svip.github.io/tfjl-web/">← 返回助手</a>
<div class="page-title">功能导览 · 思维导图</div>

<div class="hint">💡 悬停节点查看高亮，所有功能均为实际可用功能</div>

<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4fc3f7;"></div> 项目管理</div>

<script>
// 悬停联动高亮
document.querySelectorAll('.node-group').forEach(group => {
    group.addEventListener('mouseenter', () => {
        group.querySelector('.node-rect').style.filter = 'brightness(1.4) drop-shadow(0 0 12px currentColor)';
    });
    group.addEventListener('mouseleave', () => {
        group.querySelector('.node-rect').style.filter = '';
    });
});
</script>
