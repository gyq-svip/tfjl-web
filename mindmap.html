<title>功能导览 - 塔防精灵助手</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
        overflow: hidden;
        user-select: none;
    }

    /* 缩放容器 */
    #zoomContainer {
        position: absolute; inset: 0;
        transform-origin: 0 0;
        transition: transform 0.15s ease-out;
        cursor: grab;
    }
    #zoomContainer.dragging { cursor: grabbing; transition: none; }

    svg { display: block; }

    /* 返回按钮 */
    .back-btn {
        position: fixed; top: 16px; left: 16px; z-index: 20;
        background: rgba(255,255,255,0.12); border: 1px solid rgba(255,215,0,0.4);
        color: #ffd700; padding: 8px 18px; border-radius: 8px;
        cursor: pointer; font-size: 0.85rem; font-weight: 600;
        text-decoration: none; transition: all 0.3s;
        backdrop-filter: blur(8px);
    }
    .back-btn:hover { background: rgba(255,215,0,0.2); border-color: #ffd700; }

    /* 标题 */
    .page-title {
        position: fixed; top: 16px; right: 30px; z-index: 20;
        color: rgba(255,255,255,0.7); font-size: 0.85rem; pointer-events: none;
    }

    /* 缩放控件 */
    .zoom-controls {
        position: fixed; bottom: 24px; right: 24px; z-index: 20;
        display: flex; flex-direction: column; gap: 8px;
    }
    .zoom-btn {
        width: 38px; height: 38px; border-radius: 10px;
        background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
        color: #fff; font-size: 1.2rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s; backdrop-filter: blur(8px);
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,215,0,0.5); }
    .zoom-level {
        text-align: center; color: rgba(255,255,255,0.6); font-size: 0.75rem;
        padding: 2px 0;
    }

    /* 图例 */
    .legend {
        position: fixed; bottom: 24px; left: 24px; z-index: 20;
        display: flex; flex-wrap: wrap; gap: 16px;
    }
    .legend-item {
        display: flex; align-items: center; gap: 6px;
        color: rgba(255,255,255,0.7); font-size: 0.75rem;
    }
    .legend-dot {
        width: 10px; height: 10px; border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
    }

    /* 节点动画 */
    .node-group { cursor: pointer; }
    .node-group:hover .node-rect { filter: brightness(1.3); }
    .node-rect { transition: filter 0.2s ease; }
    .conn-line { fill: none; stroke-width: 2; opacity: 0.5; }
    .conn-line-sub { fill: none; stroke-width: 1.5; opacity: 0.35; }

    /* 提示 */
    .hint {
        position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 20;
        color: rgba(255,255,255,0.35); font-size: 0.73rem; pointer-events: none;
    }
</style>
</head>

    <g class="node-group"><rect x="630" y="745" rx="7" ry="7" width="660" height="30" fill="rgba(255,152,0,0.14)" stroke="rgba(255,152,0,0.4)" stroke-width="1"/><text x="645" y="765" fill="rgba(255,255,255,0.88)" font-size="11.5">⚙️ APP 本地设置 — 配置老马目录路径，脚本可直接写入本地文件夹</text></g>
    <g class="node-group"><rect x="630" y="781" rx="7" ry="7" width="660" height="30" fill="rgba(255,152,0,0.14)" stroke="rgba(255,152,0,0.4)" stroke-width="1"/><text x="645" y="801" fill="rgba(255,255,255,0.88)" font-size="11.5">📖 帮助页 + 功能导览 + 刷新资源 — 完整文档、思维导图、强制刷新缓存</text></g>

</svg>
</div>

<script>
// ===== 缩放与拖拽 =====
let scale = 1;
let tx = 0, ty = 0;
const container = document.getElementById('zoomContainer');
const svg = container.querySelector('svg');
const MIN_SCALE = 0.4;
const MAX_SCALE = 2.5;
const STEP = 0.1;

function applyTransform() {
    container.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
}

// 鼠标滚轮缩放
container.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const prevScale = scale;
    if (e.deltaY < 0) scale = Math.min(MAX_SCALE, scale + STEP);
    else scale = Math.max(MIN_SCALE, scale - STEP);

    // 以鼠标位置为中心缩放
    const ratio = scale / prevScale;
    tx = mx - ratio * (mx - tx);
    ty = my - ratio * (my - ty);

    applyTransform();
}, { passive: false });

// 拖拽平移
let isDragging = false, startX, startY, startTX, startTY;
container.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isDragging = true;
    container.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    startTX = tx;
    startTY = ty;
    e.preventDefault();
});
window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    tx = startTX + (e.clientX - startX);
    ty = startTY + (e.clientY - startY);
    applyTransform();
});
window.addEventListener('mouseup', function() {
    isDragging = false;
    container.classList.remove('dragging');
});

// 触摸支持（双指缩放）
let lastDist = 0;
container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
        lastDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
}, { passive: true });
container.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastDist > 0) {
            const delta = (dist - lastDist) * 0.01;
            scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale + delta));
            applyTransform();
        }
        lastDist = dist;
    }
}, { passive: true });

// 缩放按钮
document.getElementById('zoomInBtn').addEventListener('click', function() {
    scale = Math.min(MAX_SCALE, scale + STEP * 1.5);
    applyTransform();
});
document.getElementById('zoomOutBtn').addEventListener('click', function() {
    scale = Math.max(MIN_SCALE, scale - STEP * 1.5);
    applyTransform();
});
document.getElementById('zoomResetBtn').addEventListener('click', function() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
});

// 初始适应屏幕
function autoFit() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const svgW = 1400, svgH = 980;
    const fitScale = Math.min(vw / svgW, vh / svgH, 1);
    scale = Math.max(MIN_SCALE, fitScale * 0.9);
    tx = (vw - svgW * scale) / 2;
    ty = Math.max(0, (vh - svgH * scale) / 2);
    applyTransform();
}
autoFit();
window.addEventListener('resize', autoFit);

// 节点悬停效果
document.querySelectorAll('.node-group').forEach(group => {
    group.addEventListener('mouseenter', () => {
        const rect = group.querySelector('.node-rect');
        if (rect) rect.style.filter = 'brightness(1.5) drop-shadow(0 0 14px currentColor)';
    });
    group.addEventListener('mouseleave', () => {
        const rect = group.querySelector('.node-rect');
        if (rect) rect.style.filter = '';
    });
});

// 双击节点重置视图
svg.addEventListener('dblclick', function() { scale = 1; tx = 0; ty = 0; applyTransform(); });
</script>

</body>
