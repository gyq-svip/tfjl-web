    container.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
}

// 滚轮缩放（Ctrl+滚轮=大步长）
container.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const prevScale = scale;
    const step = e.ctrlKey ? STEP * 2.5 : STEP;
    if (e.deltaY < 0) scale = Math.min(MAX_SCALE, scale + step);
    else scale = Math.max(MIN_SCALE, scale - step);
    const ratio = scale / prevScale;
    tx = mx - ratio * (mx - tx);
    ty = my - ratio * (my - ty);
    applyTransform();
}, { passive: false });

// 拖拽平移
let isDragging = false, sx, sy, stx, sty;
container.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isDragging = true; container.classList.add('dragging');
    sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
    e.preventDefault();
});
window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy);
    applyTransform();
});
window.addEventListener('mouseup', function() { isDragging = false; container.classList.remove('dragging'); });

// 触摸双指缩放
let lastDist = 0;
container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}, { passive: true });
container.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && lastDist > 0) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale + (d - lastDist) * 0.008));
        applyTransform(); lastDist = d;
    }
}, { passive: true });

document.getElementById('zoomInBtn').addEventListener('click', () => { scale = Math.min(MAX_SCALE, scale + STEP * 1.5); applyTransform(); });
document.getElementById('zoomOutBtn').addEventListener('click', () => { scale = Math.max(MIN_SCALE, scale - STEP * 1.5); applyTransform(); });
document.getElementById('zoomResetBtn').addEventListener('click', () => { scale = 1; tx = 0; ty = 0; applyTransform(); });

function autoFit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const svgW = 1600, svgH = 1350;
    const fit = Math.min(vw / svgW, vh / svgH, 1);
    scale = Math.max(MIN_SCALE, fit * 0.88);
    tx = Math.max(0, (vw - svgW * scale) / 2);
    ty = Math.max(0, (vh - svgH * scale) / 2);
    applyTransform();
}
autoFit(); window.addEventListener('resize', autoFit);

// 悬停高亮
document.querySelectorAll('.node-group').forEach(g => {
    g.addEventListener('mouseenter', () => { const r = g.querySelector('.node-rect'); if (r) r.style.filter = 'brightness(1.6)'; });
    g.addEventListener('mouseleave', () => { const r = g.querySelector('.node-rect'); if (r) r.style.filter = ''; });
});
</script>
</body>
