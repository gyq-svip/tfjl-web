<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>🌊 深海统计 — 塔防助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;padding:14px;color:#fff;-webkit-font-smoothing:antialiased}
.container{max-width:1180px;margin:0 auto}
h1{font-size:1.5rem;color:#4dd0e1;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:rgba(255,255,255,0.5);font-size:0.78rem;margin-bottom:14px}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(8px);border:1px solid rgba(77,182,172,0.3);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{color:#4dd0e1;font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .badge{font-size:0.7rem;color:rgba(255,255,255,0.6);font-weight:normal;background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row > *{flex:0 0 auto}
label{font-size:0.78rem;color:rgba(255,255,255,0.75);min-width:60px}
input,select,textarea{background:rgba(0,0,0,0.3);border:1px solid rgba(77,182,172,0.4);color:#fff;padding:6px 10px;border-radius:6px;font-size:0.85rem;font-family:inherit}
button{background:linear-gradient(135deg,#4dd0e1,#00838f);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;font-weight:500;font-family:inherit;transition:transform 0.1s}
button:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(77,182,172,0.3)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2)}
button.small{padding:3px 8px;font-size:0.74rem}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
th{color:#4dd0e1;font-weight:600;font-size:0.74rem;background:rgba(77,182,172,0.08);position:sticky;top:0}
tr:hover td{background:rgba(77,182,172,0.06)}
.scroll-y{max-height:560px;overflow-y:auto;border:1px solid rgba(77,182,172,0.15);border-radius:6px}
.empty{padding:30px 10px;text-align:center;color:rgba(255,255,255,0.4);font-size:0.85rem;line-height:1.7}
/* 前三名颜色标记（金/银/铜） */
.rk-gold{color:#ffd700;font-weight:bold;text-shadow:0 0 6px rgba(255,215,0,0.4)}
.rk-silver{color:#d8d8d8;font-weight:bold}
.rk-bronze{color:#e0985a;font-weight:bold}
tr.top1 td:first-child{box-shadow:inset 3px 0 0 #ffd700}
tr.top2 td:first-child{box-shadow:inset 3px 0 0 #d8d8d8}
tr.top3 td:first-child{box-shadow:inset 3px 0 0 #e0985a}
tr.top1 td{background:rgba(255,215,0,0.06)}
tr.top2 td{background:rgba(216,216,216,0.05)}
tr.top3 td{background:rgba(224,152,90,0.05)}
tr.top1:hover td,tr.top2:hover td,tr.top3:hover td{background:rgba(77,182,172,0.10)}
/* 人均阵营排名末3：弱联盟，弱化显示 */
tr.weak td{opacity:0.5}
tr.weak:hover td{opacity:1;background:rgba(77,182,172,0.10)}
td .weak-tag{color:#ef5350;font-size:0.7rem;margin-left:4px;}
td .strong-tag{color:#ffd700;font-size:0.7rem;margin-left:4px;}
.hidden{display:none!important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:0.85rem;z-index:99999;animation:fadeInOut 2s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-10px)}15%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}

/* 阵营图标标签 */
.faction-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.faction-icon{padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;font-size:0.85rem;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;transition:all .15s;user-select:none}
.faction-icon .emo{font-size:1.3rem;line-height:1}
.faction-icon:hover{background:rgba(77,182,172,0.12)}
.faction-icon.active{background:rgba(77,182,172,0.28);border-color:#4dd0e1;color:#fff;box-shadow:0 2px 10px rgba(77,182,172,0.25)}
@media (max-width:640px){input,select,textarea{font-size:0.95rem}}
</style>
</head>
<body>
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;">
        <h1 style="margin:0;">🌊 深海统计</h1>
        <div style="display:flex;gap:6px;">
            <button class="ghost small" onclick="history.back()" title="返回主站">← 返回</button>
            <button class="ghost small" onclick="window.close()" title="关闭此页">✕ 关闭</button>
        </div>
    </div>
    <div class="sub">四大阵营联盟实力 · 前20名</div>

    <!-- 联盟排行（唯一板块） -->
    <div class="card">
        <h3>🏆 联盟前20 <span class="badge" id="rankingBadge">未导入</span></h3>
        <div class="faction-bar" id="factionBar">
            <div class="faction-icon active" data-faction="总排名" onclick="switchFaction('总排名')"><span class="emo">📊</span>总排名</div>
            <div class="faction-icon" data-faction="暗月地精" onclick="switchFaction('暗月地精')"><span class="emo">🌙</span>暗月地精</div>
            <div class="faction-icon" data-faction="人类联盟" onclick="switchFaction('人类联盟')"><span class="emo">⚔️</span>人类联盟</div>
            <div class="faction-icon" data-faction="天灾亡灵" onclick="switchFaction('天灾亡灵')"><span class="emo">💀</span>天灾亡灵</div>
            <div class="faction-icon" data-faction="兽人部落" onclick="switchFaction('兽人部落')"><span class="emo">👹</span>兽人部落</div>
        </div>
        <div class="row" style="margin-bottom:8px;">
            <button onclick="importRankingsFromDisk()" class="ghost small">📂 从 dataDir 加载</button>
            <label class="ghost small" style="cursor:pointer;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);padding:3px 8px;border-radius:6px;font-size:0.74rem;">
                📤 选择 JSON 文件<input type="file" id="rankingFile" accept=".json" style="display:none" onchange="importRankingsFile(event)">
            </label>
            <span style="font-size:0.72rem;color:rgba(255,255,255,0.5);">来源: 四大阵营联盟实力前50汇总.xlsx</span>
        </div>
        <div class="scroll-y">
            <table id="rankingTable">
                <thead id="rankingHead"></thead>
                <tbody id="rankingTbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 板块A：赛季末记录（最后3天战况 + 各势力代表战绩） -->
    <div class="card">
        <h3>🏁 赛季末记录 <span class="badge" id="seasonEndBadge">共 0 个赛季</span></h3>
        <div class="row" style="margin-bottom:10px;">
            <label style="min-width:auto;">赛季名</label>
            <input id="seSeason" placeholder="如 S1 / 2026夏季" style="flex:1 1 130px;min-width:110px;">
            <label style="min-width:auto;">日期</label>
            <input id="seDate" type="date" style="flex:0 1 140px;min-width:120px;">
        </div>
        <div class="row" style="margin-bottom:8px;font-size:0.75rem;color:rgba(255,255,255,0.6);">
            赛季最后3天战况（每一天一段，记录当日联盟表现/关键事件）
        </div>
        <div class="row" style="margin-bottom:6px;">
            <label style="min-width:auto;">第3天</label>
            <textarea id="seDay3" rows="2" placeholder="倒数第3天战况" style="flex:1 1 200px;min-width:160px;resize:vertical;"></textarea>
        </div>
        <div class="row" style="margin-bottom:6px;">
            <label style="min-width:auto;">第2天</label>
            <textarea id="seDay2" rows="2" placeholder="倒数第2天战况" style="flex:1 1 200px;min-width:160px;resize:vertical;"></textarea>
        </div>
        <div class="row" style="margin-bottom:10px;">
            <label style="min-width:auto;">第1天</label>
            <textarea id="seDay1" rows="2" placeholder="赛季最后一天战况" style="flex:1 1 200px;min-width:160px;resize:vertical;"></textarea>
        </div>
        <div class="row" style="margin-bottom:8px;">
            <button onclick="saveSeasonEnd()">💾 记录本赛季（自动抓各势力代表战绩）</button>
            <span style="font-size:0.72rem;color:rgba(255,255,255,0.5);">代表战绩 = 当前排行中各阵营战力最高的联盟</span>
        </div>
        <div class="row" style="margin-bottom:8px;">
            <label style="min-width:auto;">查看</label>
            <select id="seSelect" onchange="renderSeasonEnd()" style="flex:1 1 140px;min-width:120px;">
                <option value="">— 选择赛季 —</option>
            </select>
            <button class="ghost small" onclick="deleteSeasonEnd()">🗑 删除</button>
        </div>
        <div id="seDetail" class="scroll-y" style="max-height:300px;"></div>

        <h3 style="margin-top:14px;">📈 势力战绩趋势 <span style="font-size:0.7rem;color:rgba(255,255,255,0.5);font-weight:normal;">（各阵营代表联盟战力随赛季变化）</span></h3>
        <div id="trendSvg"></div>
    </div>
</div>

<script>
// ===================== 存储辅助 =====================
function dsGet(key){
    try{
        if(window.__tfjlStore && typeof window.__tfjlStore.get==='function') return window.__tfjlStore.get(key);
        return localStorage.getItem(key);
    }catch(e){return null}
}
function dsSet(key,val){
    try{
        if(window.__tfjlStore && typeof window.__tfjlStore.set==='function') return window.__tfjlStore.set(key,val);
        localStorage.setItem(key,val);
    }catch(e){}
}
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2100)}

// ===================== 数据层 =====================
let state = {
    rankings: [],
    curFaction: '总排名'
};

function loadAll(){
    try{
        const r = dsGet('deepsea_rankings');
        state.rankings = r ? JSON.parse(r) : [];
    }catch(e){console.warn('加载失败',e)}
}
function saveRankings(){dsSet('deepsea_rankings', JSON.stringify(state.rankings))}

// ===================== 排行 =====================
function switchFaction(f){
    state.curFaction = f;
    document.querySelectorAll('#factionBar .faction-icon').forEach(t=>{
        t.classList.toggle('active', t.dataset.faction===f);
    });
    renderRankings();
}
const FACTION_COLS = ['排名','联盟名称','人均战力','人均阵营排名','人数','满员率','联盟等级','联盟战力','阵营内名次'];
// 该联盟在所属阵营内，按"人均战力"降序的名次（反映真实实力/夺冠概率）
function factionInnerPowerRank(r){
    const fr0 = fillRate(r['人数']); const denom0 = fr0?fr0.cur:parseNum(r['人数']);
    const p0 = denom0? parsePower(r['联盟战力'])/denom0 : 0;
    const sub = state.rankings.filter(x=>x['所属阵营']===r['所属阵营']);
    sub.sort((a,b)=>{
        const fa=fillRate(a['人数']), da=fa?fa.cur:parseNum(a['人数']);
        const fb=fillRate(b['人数']), db=fb?fb.cur:parseNum(b['人数']);
        const pa=da?parsePower(a['联盟战力'])/da:0, pb=db?parsePower(b['联盟战力'])/db:0;
        return pb-pa;
    });
    const i = sub.findIndex(x=>x['联盟名称']===r['联盟名称'] && x['联盟ID']===r['联盟ID']);
    return i>=0 ? i+1 : null;
}
// 派生指标
function parseNum(v){ if(typeof v==='number') return v; if(!v) return 0; const m=String(v).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
function fillRate(ren){ // 人数 "77/84"
    const m=String(ren||'').match(/(\d+)\s*\/\s*(\d+)/);
    if(!m) return null;
    const cur=+m[1], max=+m[2];
    return max? {cur,max,pct:Math.round(cur/max*100)} : null;
}
function factionInnerRank(r){ // 该联盟在自己阵营内的名次
    const sub = state.rankings.filter(x=>x['所属阵营']===r['所属阵营']);
    sub.sort((a,b)=>(+a['排名']||0)-(+b['排名']||0));
    const i = sub.findIndex(x=>x['联盟名称']===r['联盟名称'] && x['联盟ID']===r['联盟ID']);
    return i>=0 ? i+1 : null;
}
function renderRankings(){
    const head = document.getElementById('rankingHead');
    const tbody = document.getElementById('rankingTbody');
    const badge = document.getElementById('rankingBadge');
    let data;
    if(state.curFaction === '总排名'){
        // 总排名：每个联盟作为单位，按全局 排名 排序
        data = state.rankings.slice().sort((a,b)=>(+a['排名']||0)-(+b['排名']||0));
        badge.textContent = data.length ? `总排名 · ${data.length} 个联盟` : '未导入';
    }else{
        // 各阵营前20
        const sub = state.rankings.filter(r=>r['所属阵营']===state.curFaction);
        data = sub.length ? sub : [];
        badge.textContent = data.length ? `${state.curFaction} · ${data.length} 条` : '未导入';
    }
    head.innerHTML = '<tr>'+FACTION_COLS.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
    if(!data.length){
        tbody.innerHTML = '<tr><td colspan="'+FACTION_COLS.length+'" class="empty">未导入排行数据<br>点上方"📂 从 dataDir 加载"或"📤 选择 JSON 文件"导入 deepsea-rankings.json</td></tr>';
        return;
    }
    tbody.innerHTML = data.slice(0,20).map((r,idx)=>{
        // 高强度判定统一用"阵营内人均战力排名"：前3强、末3弱
        const pr = factionInnerPowerRank(r);
        let rowCls='';
        if(pr===1) rowCls='top1'; else if(pr===2) rowCls='top2'; else if(pr===3) rowCls='top3';
        else if(pr!=null){ const cnt = state.rankings.filter(x=>x['所属阵营']===r['所属阵营']).length; if(pr>cnt-3) rowCls='weak'; }
        const strongTag = (pr!=null && pr<=3) ? '<span class="strong-tag">🔥强</span>' : (rowCls==='weak'?'<span class="weak-tag">⬇弱</span>':'');
        return '<tr class="'+(rowCls)+'">'+FACTION_COLS.map(c=>{
        let v = r[c];
        if(c==='排名'){
            const rkClass=['rk-gold','rk-silver','rk-bronze'][idx]||'';
            return `<td class="${rkClass}">${esc(v??'-')}</td>`;
        }
        if(c==='人均战力'){
            const pw = parsePower(r['联盟战力']); const fr = fillRate(r['人数']);
            const denom = fr?fr.cur:parseNum(r['人数']);
            const per = denom?Math.round(pw/denom):0;
            return `<td>${per?per.toLocaleString():'-'}${strongTag}</td>`;
        }
        if(c==='人均阵营排名'){
            return `<td>${pr!=null?('#'+pr):'-'}</td>`;
        }
        if(c==='满员率'){
            const fr = fillRate(r['人数']);
            if(!fr) return `<td>${esc(r['人数']??'-')}</td>`;
            const color = fr.pct>=95?'#2ecc71':fr.pct>=80?'#f1c40f':'#e67e22';
            return `<td><div style="display:flex;align-items:center;gap:5px;"><div style="flex:1;min-width:40px;height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;"><div style="width:${fr.pct}%;height:100%;background:${color};"></div></div><span style="font-size:0.72rem;color:${color};min-width:30px;">${fr.pct}%</span></div></td>`;
        }
        if(c==='阵营内名次'){
            const ir = factionInnerRank(r);
            return `<td>${ir!=null?('#'+ir):'-'}</td>`;
        }
        if(c==='联盟战力') {
            // 联盟战力已含 HTML 标签，直接输出（不 esc）
            return `<td>${v ?? '-'}</td>`;
        }
        return `<td>${esc(v??'-')}</td>`;
    }).join('')+'</tr>'}).join('');
}
async function importRankingsFile(event){
    const f = event.target.files[0]; if(!f) return;
    try{
        const txt = await f.text();
        const json = JSON.parse(txt);
        let rankings = [];
        if(Array.isArray(json)) rankings = json;
        else if(json.totalRanking) rankings = json.totalRanking;
        else {toast('JSON 格式不识别');return}
        state.rankings = rankings;
        saveRankings();
        renderRankings();
        toast(`✅ 已导入 ${rankings.length} 条`);
    }catch(e){toast('导入失败：'+e.message)}
    event.target.value = '';
}
async function importRankingsFromDisk(){
    try{
        if(window.__TAURI_INTERNALS__ || window.__TAURI__){
            const invoke = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
            if(invoke){
                const txt = await invoke('read_text_file_auto', {path:'D:\\withfriends\\塔防精灵助手数据\\data\\deepsea-rankings.json'});
                const json = JSON.parse(txt);
                let rankings = Array.isArray(json)?json:(json.totalRanking||[]);
                state.rankings = rankings;
                saveRankings();
                renderRankings();
                toast(`✅ 从 dataDir 导入 ${rankings.length} 条`);
                return;
            }
        }
        toast('非 Tauri 环境，请用上方"选择 JSON 文件"');
    }catch(e){
        toast('读取失败：'+e.message+'。可手动选 JSON 文件');
    }
}

// ===================== 赛季末记录 + 势力趋势 =====================
const FACTIONS = ['暗月地精','人类联盟','天灾亡灵','兽人部落'];
function loadSeasonEnd(){
    try{
        const t = dsGet('deepsea_season_end');
        return t ? JSON.parse(t) : {};
    }catch(e){return {}}
}
function saveSeasonEndMap(map){dsSet('deepsea_season_end', JSON.stringify(map))}
// 当前排行里各阵营战力最高的联盟
function factionReps(){
    const reps = {};
    FACTIONS.forEach(f=>{
        const sub = state.rankings.filter(r=>r['所属阵营']===f);
        if(sub.length){
            sub.sort((a,b)=>(+parsePower(b['联盟战力']||0))-(+parsePower(a['联盟战力']||0)));
            const top = sub[0];
            reps[f] = { '联盟名称': top['联盟名称'], '联盟战力': top['联盟战力'], '会长': top['会长'], '排名': top['排名'] };
        }
    });
    return reps;
}
function parsePower(v){
    if(typeof v === 'number') return v;
    if(!v) return 0;
    return +String(v).replace(/[^\d]/g,'') || 0;
}
function saveSeasonEnd(){
    const name = (document.getElementById('seSeason').value||'').trim();
    const date = document.getElementById('seDate').value || today();
    if(!name){toast('请先输入赛季名');return}
    const reps = factionReps();
    if(!Object.keys(reps).length){toast('请先导入排行数据');return}
    const rec = {
        date,
        factions: reps,
        days: {
            d3: document.getElementById('seDay3').value || '',
            d2: document.getElementById('seDay2').value || '',
            d1: document.getElementById('seDay1').value || ''
        },
        savedAt: today()
    };
    const map = loadSeasonEnd();
    map[name] = rec;
    saveSeasonEndMap(map);
    refreshSeasonSelect(name);
    renderSeasonEnd();
    renderTrend();
    toast(`✅ 已记录「${name}」`);
}
function refreshSeasonSelect(sel){
    const map = loadSeasonEnd();
    const selEl = document.getElementById('seSelect');
    const names = Object.keys(map).sort((a,b)=>(map[b].date||'') > (map[a].date||'') ? 1 : -1);
    selEl.innerHTML = '<option value="">— 选择赛季 —</option>' + names.map(n=>`<option value="${esc(n)}">${esc(n)}（${esc(map[n].date||'')}）</option>`).join('');
    if(sel) selEl.value = sel;
    document.getElementById('seasonEndBadge').textContent = `共 ${names.length} 个赛季`;
}
function renderSeasonEnd(){
    const name = document.getElementById('seSelect').value;
    const box = document.getElementById('seDetail');
    const map = loadSeasonEnd();
    if(!name || !map[name]){
        box.innerHTML = '<div class="empty">选择赛季查看详情，或上方记录本赛季</div>';
        return;
    }
    const rec = map[name];
    let html = `<div style="font-size:0.8rem;line-height:1.9;">`;
    html += `<div style="margin-bottom:8px;"><b style="color:#4dd0e1;">📅 ${esc(rec.date||'-')}</b></div>`;
    // 各势力代表战绩
    html += '<table style="margin-bottom:10px;"><thead><tr><th>阵营</th><th>代表联盟</th><th>联盟战力</th><th>会长</th></tr></thead><tbody>';
    FACTIONS.forEach(f=>{
        const r = rec.factions[f];
        if(r) html += `<tr><td>${esc(f)}</td><td>${esc(r['联盟名称']||'-')}</td><td>${r['联盟战力']!=null?r['联盟战力']:'-'}</td><td>${esc(r['会长']||'-')}</td></tr>`;
        else html += `<tr><td>${esc(f)}</td><td colspan="3" style="color:rgba(255,255,255,0.4)">无数据</td></tr>`;
    });
    html += '</tbody></table>';
    // 最后3天战况
    const d = rec.days||{};
    const labels = [['d3','⏳ 倒数第3天'],['d2','⏳ 倒数第2天'],['d1','🏁 赛季最后一天']];
    labels.forEach(([k,lab])=>{
        html += `<div style="margin-bottom:6px;"><b style="color:#ffd700;">${lab}</b><div style="color:rgba(255,255,255,0.85);white-space:pre-wrap;padding:4px 0;">${esc(d[k]||'（未填写）')}</div></div>`;
    });
    html += '</div>';
    box.innerHTML = html;
}
function deleteSeasonEnd(){
    const name = document.getElementById('seSelect').value;
    if(!name){toast('请先选择赛季');return}
    const map = loadSeasonEnd();
    if(!map[name]){toast('赛季不存在');return}
    delete map[name];
    saveSeasonEndMap(map);
    refreshSeasonSelect();
    renderSeasonEnd();
    renderTrend();
    toast(`🗑 已删除「${name}」`);
}
// SVG 折线：X=赛季，Y=各阵营代表联盟战力，4条线
function renderTrend(){
    const wrap = document.getElementById('trendSvg');
    if(!wrap) return;
    const map = loadSeasonEnd();
    const names = Object.keys(map).sort((a,b)=>(map[a].date||'') > (map[b].date||'') ? 1 : -1);
    if(names.length < 1){wrap.innerHTML = '<div class="empty">记录至少 1 个赛季后显示趋势</div>';return;}
    const W=760,H=320,padL=64,padR=20,padT=20,padB=40;
    const maxP = Math.max(1, ...names.flatMap(n=>FACTIONS.map(f=>parsePower((map[n].factions[f]||{}).联盟战力||0))));
    const xStep = names.length>1 ? (W-padL-padR)/(names.length-1) : 0;
    const xOf = i => names.length>1 ? padL + i*xStep : W/2;
    const yOf = v => padT + (H-padT-padB)*(1 - v/maxP);
    const colors = {'暗月地精':'#9b59b6','人类联盟':'#3498db','天灾亡灵':'#2ecc71','兽人部落':'#e67e22'};
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;">`;
    // 网格 + Y轴刻度
    for(let g=0;g<=4;g++){
        const y = padT + (H-padT-padB)*g/4;
        const val = Math.round(maxP*(1-g/4));
        svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.08)"/>`;
        svg += `<text x="${padL-6}" y="${y+4}" fill="rgba(255,255,255,0.5)" font-size="10" text-anchor="end">${val}</text>`;
    }
    // X轴标签
    names.forEach((n,i)=>{ svg += `<text x="${xOf(i)}" y="${H-padB+16}" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">${esc(n.length>6?n.slice(0,6)+'…':n)}</text>`; });
    // 每条阵营线
    FACTIONS.forEach(f=>{
        const pts = names.map((n,i)=>{const v=parsePower((map[n].factions[f]||{}).联盟战力||0);return `${xOf(i)},${yOf(v)}`;});
        svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[f]}" stroke-width="2.5"/>`;
        names.forEach((n,i)=>{
            const v=parsePower((map[n].factions[f]||{}).联盟战力||0);
            if(v>0) svg += `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3.5" fill="${colors[f]}"/>`;
        });
    });
    svg += '</svg>';
    // 图例
    let legend = '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:0.74rem;">';
    FACTIONS.forEach(f=>{ legend += `<span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:3px;background:${colors[f]};display:inline-block;border-radius:2px;"></span>${esc(f)}</span>`; });
    legend += '</div>';
    wrap.innerHTML = svg + legend;
}

// ===================== 初始化 =====================
window.addEventListener('load', ()=>{
    loadAll();
    if(!state.rankings.length){importRankingsFromDisk()}
    refreshSeasonSelect();
    renderSeasonEnd();
    renderTrend();
    renderRankings();
});
