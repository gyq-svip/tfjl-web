<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>🌊 深海统计 — 塔防助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;padding:14px;color:#fff;-webkit-font-smoothing:antialiased}
.container{max-width:1180px;margin:0 auto}
h1{font-size:1.5rem;color:#4dd0e1;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:rgba(255,255,255,0.5);font-size:0.78rem;margin-bottom:14px}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(8px);border:1px solid rgba(77,182,172,0.3);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{color:#4dd0e1;font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .badge{font-size:0.7rem;color:rgba(255,255,255,0.6);font-weight:normal;background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row > *{flex:0 0 auto}
label{font-size:0.78rem;color:rgba(255,255,255,0.75);min-width:60px}
input,select,textarea{background:rgba(0,0,0,0.3);border:1px solid rgba(77,182,172,0.4);color:#fff;padding:6px 10px;border-radius:6px;font-size:0.85rem;font-family:inherit}
button{background:linear-gradient(135deg,#4dd0e1,#00838f);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;font-weight:500;font-family:inherit;transition:transform 0.1s}
button:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(77,182,172,0.3)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2)}
button.small{padding:3px 8px;font-size:0.74rem}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
th{color:#4dd0e1;font-weight:600;font-size:0.74rem;background:rgba(77,182,172,0.08);position:sticky;top:0}
tr:hover td{background:rgba(77,182,172,0.06)}
.scroll-y{max-height:560px;overflow-y:auto;border:1px solid rgba(77,182,172,0.15);border-radius:6px}
.empty{padding:30px 10px;text-align:center;color:rgba(255,255,255,0.4);font-size:0.85rem;line-height:1.7}
.hidden{display:none!important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:0.85rem;z-index:99999;animation:fadeInOut 2s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-10px)}15%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}

/* 阵营图标标签 */
.faction-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.faction-icon{padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;font-size:0.85rem;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;transition:all .15s;user-select:none}
.faction-icon .emo{font-size:1.3rem;line-height:1}
.faction-icon:hover{background:rgba(77,182,172,0.12)}
.faction-icon.active{background:rgba(77,182,172,0.28);border-color:#4dd0e1;color:#fff;box-shadow:0 2px 10px rgba(77,182,172,0.25)}
@media (max-width:640px){input,select,textarea{font-size:0.95rem}}
</style>
</head>
<body>
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;">
        <h1 style="margin:0;">🌊 深海统计</h1>
        <div style="display:flex;gap:6px;">
            <button class="ghost small" onclick="history.back()" title="返回主站">← 返回</button>
            <button class="ghost small" onclick="window.close()" title="关闭此页">✕ 关闭</button>
        </div>
    </div>
    <div class="sub">四大阵营联盟实力 · 前20名</div>

    <!-- 联盟排行（唯一板块） -->
    <div class="card">
        <h3>🏆 联盟前20 <span class="badge" id="rankingBadge">未导入</span></h3>
        <div class="faction-bar" id="factionBar">
            <div class="faction-icon active" data-faction="暗月地精" onclick="switchFaction('暗月地精')"><span class="emo">🌙</span>暗月地精</div>
            <div class="faction-icon" data-faction="人类联盟" onclick="switchFaction('人类联盟')"><span class="emo">⚔️</span>人类联盟</div>
            <div class="faction-icon" data-faction="天灾亡灵" onclick="switchFaction('天灾亡灵')"><span class="emo">💀</span>天灾亡灵</div>
            <div class="faction-icon" data-faction="兽人部落" onclick="switchFaction('兽人部落')"><span class="emo">👹</span>兽人部落</div>
        </div>
        <div class="row" style="margin-bottom:8px;">
            <button onclick="importRankingsFromDisk()" class="ghost small">📂 从 dataDir 加载</button>
            <label class="ghost small" style="cursor:pointer;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);padding:3px 8px;border-radius:6px;font-size:0.74rem;">
                📤 选择 JSON 文件<input type="file" id="rankingFile" accept=".json" style="display:none" onchange="importRankingsFile(event)">
            </label>
            <span style="font-size:0.72rem;color:rgba(255,255,255,0.5);">来源: 四大阵营联盟实力前50汇总.xlsx</span>
        </div>
        <div class="scroll-y">
            <table id="rankingTable">
                <thead id="rankingHead"></thead>
                <tbody id="rankingTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ===================== 存储辅助 =====================
function dsGet(key){
    try{
        if(window.__tfjlStore && typeof window.__tfjlStore.get==='function') return window.__tfjlStore.get(key);
        return localStorage.getItem(key);
    }catch(e){return null}
}
function dsSet(key,val){
    try{
        if(window.__tfjlStore && typeof window.__tfjlStore.set==='function') return window.__tfjlStore.set(key,val);
        localStorage.setItem(key,val);
    }catch(e){}
}
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2100)}

// ===================== 数据层 =====================
let state = {
    rankings: [],
    curFaction: '暗月地精'
};

function loadAll(){
    try{
        const r = dsGet('deepsea_rankings');
        state.rankings = r ? JSON.parse(r) : [];
    }catch(e){console.warn('加载失败',e)}
}
function saveRankings(){dsSet('deepsea_rankings', JSON.stringify(state.rankings))}

// ===================== 排行 =====================
function switchFaction(f){
    state.curFaction = f;
    document.querySelectorAll('#factionBar .faction-icon').forEach(t=>{
        t.classList.toggle('active', t.dataset.faction===f);
    });
    renderRankings();
}
const FACTION_COLS = ['排名','联盟名称','联盟ID','会长','人数','联盟等级','联盟战力'];
function renderRankings(){
    const head = document.getElementById('rankingHead');
    const tbody = document.getElementById('rankingTbody');
    const badge = document.getElementById('rankingBadge');
    // 该阵营前20（数据里 所属阵营 字段匹配；无匹配则退回总排名前20）
    const sub = state.rankings.filter(r=>r['所属阵营']===state.curFaction);
    const data = sub.length ? sub : state.rankings.filter(r=>true);
    badge.textContent = data.length ? `${state.curFaction} · ${data.length} 条` : '未导入';
    head.innerHTML = '<tr>'+FACTION_COLS.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
    if(!data.length){
        tbody.innerHTML = '<tr><td colspan="'+FACTION_COLS.length+'" class="empty">未导入排行数据<br>点上方"📂 从 dataDir 加载"或"📤 选择 JSON 文件"导入 deepsea-rankings.json</td></tr>';
        return;
    }
    tbody.innerHTML = data.slice(0,20).map(r=>'<tr>'+FACTION_COLS.map(c=>{
        let v = r[c];
        if(c==='联盟战力') {
            // 联盟战力已含 HTML 标签，直接输出（不 esc）
            return `<td>${v ?? '-'}</td>`;
        }
        return `<td>${esc(v??'-')}</td>`;
    }).join('')+'</tr>').join('');
}
async function importRankingsFile(event){
    const f = event.target.files[0]; if(!f) return;
    try{
        const txt = await f.text();
        const json = JSON.parse(txt);
        let rankings = [];
        if(Array.isArray(json)) rankings = json;
        else if(json.totalRanking) rankings = json.totalRanking;
        else {toast('JSON 格式不识别');return}
        state.rankings = rankings;
        saveRankings();
        renderRankings();
        toast(`✅ 已导入 ${rankings.length} 条`);
    }catch(e){toast('导入失败：'+e.message)}
    event.target.value = '';
}
async function importRankingsFromDisk(){
    try{
        if(window.__TAURI_INTERNALS__ || window.__TAURI__){
            const invoke = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
            if(invoke){
                const txt = await invoke('read_text_file_auto', {path:'D:\\withfriends\\塔防精灵助手数据\\data\\deepsea-rankings.json'});
                const json = JSON.parse(txt);
                let rankings = Array.isArray(json)?json:(json.totalRanking||[]);
                state.rankings = rankings;
                saveRankings();
                renderRankings();
                toast(`✅ 从 dataDir 导入 ${rankings.length} 条`);
                return;
            }
        }
        toast('非 Tauri 环境，请用上方"选择 JSON 文件"');
    }catch(e){
        toast('读取失败：'+e.message+'。可手动选 JSON 文件');
    }
}

// ===================== 初始化 =====================
window.addEventListener('load', ()=>{
    loadAll();
    if(!state.rankings.length){importRankingsFromDisk()}
    renderRankings();
});
</script>
</body>
</html>
