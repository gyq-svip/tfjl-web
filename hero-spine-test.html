<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine 动画 PoC - 小野</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#1b2a4a,#0a0e1f);font-family:"Microsoft YaHei",sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .stage{width:min(420px,80vw);height:min(520px,70vh);position:relative;border:1px solid rgba(78,205,196,.4);border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#141a33,#0d1b2a)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .st{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:.8rem;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
  h1{font-size:1.1rem;margin:0 0 14px;color:#4ecdc4}
  .btns{margin-top:14px;display:flex;gap:8px}
  button{padding:6px 14px;border-radius:8px;border:1px solid rgba(78,205,196,.6);background:rgba(78,205,196,.15);color:#4ecdc4;cursor:pointer;font-size:.82rem}
</style>
</head>
<body>
  <h1>🧙 Spine 动画 PoC · 小野(qiqi)</h1>
  <div class="stage"><canvas id="cv"></canvas><div class="st" id="st">初始化…</div></div>
  <div class="btns">
    <button onclick="spineHero.play(document.getElementById('cv'),'qiqi',{fitPadding:0.9,onStatus:s=>document.getElementById('st').textContent=s})">▶ 播放小野</button>
  </div>
  <script src="spine-hero.js"></script>
  <script>
    document.getElementById('st').textContent='加载中…'
    spineHero.play(document.getElementById('cv'),'qiqi',{fitPadding:0.9,onStatus:function(s){document.getElementById('st').textContent=s||'idle 播放中'}})
  </script>
</body>
</html>
