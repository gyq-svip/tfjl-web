name: 整理聊天消息队列

# 🔴 2026-08-07 已停用自动定时触发，改为「仅手动触发」。
# 停用原因（实测证据）：
#   1. 原为 `*/20 * * * *`（每 20 分钟 / 每天 72 次），持续占用 Actions 并发额度，
#      与「Deploy to GitHub Pages」互相抢占，导致部署在 `Set up job` 阶段
#      间歇性失败（跑满 5 分钟才报错），2026-08-06 16:10 之后部署全线失败。
#   2. 曾有一次任务卡在 queued 超过 30 分钟，堵死整个 Actions 队列，
#      使新推送的 commit 连运行记录都无法生成，线上页面长期停留在旧版本。
#   3. 本工作流依赖 secrets.GIST_TOKEN，而该 Secret 当前并未配置，
#      每次运行都在第 3 步直接 exit 0 空转，毫无实际作用。
# 如需恢复自动执行：先在仓库 Settings → Secrets 配置 GIST_TOKEN，
# 再取消下方 schedule 注释，且建议频率放宽到每 6 小时（'0 */6 * * *'）以免再次抢占额度。
on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch: {}      # 仅支持手动触发

permissions:
  contents: read

jobs:
  sort-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 单次最多5分钟，防止卡死

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 检查 Token 配置
        run: |
          echo "检查 GIST_TOKEN 配置..."
          if [ -z "${{ secrets.GIST_TOKEN }}" ]; then
            echo "❌ GIST_TOKEN 未配置，跳过执行"
            exit 0
          else
            echo "✅ GIST_TOKEN 已配置"
          fi

      - name: 运行消息整理脚本
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_INDEX_ID: 'a32a0628bd9275f3a4922cd12cf298c9'
        run: node scripts/sort-messages.js

      - name: 输出执行摘要
        if: always()
        run: |
          echo "========================================="
          echo "消息整理任务执行完毕"
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================="
