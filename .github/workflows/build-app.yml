name: Build App (APK + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/build-app.yml' ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry tfjl-assistant-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la tfjl-assistant-ios-unsigned.ipa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-ios-unsigned
          path: app/tfjl-assistant-ios-unsigned.ipa
