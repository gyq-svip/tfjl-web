name: Build App (APK + IPA)

on:
  workflow_dispatch:   # 手动触发（Actions 页面点 Run workflow）——macOS 计费 10 倍，按需使用省额度

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Read version
        id: ver
        working-directory: app
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry tfjl-assistant-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la tfjl-assistant-ios-unsigned.ipa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-ios-unsigned
          path: app/tfjl-assistant-ios-unsigned.ipa

      - name: Publish to releases branch (direct links)
        # 🔴 修复：必须在仓库根执行。原版 working-directory: app 导致
        #   1) flutter build 改了 ios 工程文件 → `git checkout releases` 被本地改动卡住 →
        #      落到 orphan，继承整个 main 的 index；
        #   2) `git rm -rf .` 只清了 app/ 子目录 → releases 分支被塞进全站 1727 个文件。
        #   现改为根目录 -f 强切 + 根目录全量清空，releases 分支只留 README + 两个安装包。
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@tfjl.local"
          git fetch origin releases || true
          git checkout -f releases 2>/dev/null || git checkout -f --orphan releases
          git rm -rf --ignore-unmatch . || true
          mv app/build/app/outputs/flutter-apk/app-release.apk tfjl-android-v${{ steps.ver.outputs.version }}.apk
          mv app/tfjl-assistant-ios-unsigned.ipa tfjl-ios-v${{ steps.ver.outputs.version }}.ipa
          DATE=$(date '+%Y-%m-%d %H:%M')
          printf '# APP 安装包\n\n- 更新时间: %s\n- tfjl-android-v*.apk —— 安卓直接安装\n- tfjl-ios-v*.ipa —— iPhone 用爱思助手/AltStore 自签安装\n' "$DATE" > README.md
          git add -f tfjl-android-v*.apk tfjl-ios-v*.ipa README.md
          git commit -m "packages $DATE" || true
          git push origin releases --force
