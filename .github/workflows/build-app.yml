name: Build App (APK + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/build-app.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Read version
        id: ver
        working-directory: app
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Bake Gist token (extract from live app-core.js)
        run: |
          python3 -c "
          import re, urllib.request
          req = urllib.request.Request('https://gyq-svip.github.io/tfjl-web/app-core.js', headers={'User-Agent':'TFJL-CI'})
          js = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
          m = re.search(r\"HARDCODED_TOKEN\s*=\s*'([^']{20,})'\", js)
          assert m and (m.group(1).startswith('ghp_') or m.group(1).startswith('github_pat_')), 'token not found'
          open('app/assets/data/token.txt','w').write(m.group(1))
          print('token baked:', m.group(1)[:10]+'...')
          "

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry tfjl-assistant-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la tfjl-assistant-ios-unsigned.ipa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-ios-unsigned
          path: app/tfjl-assistant-ios-unsigned.ipa

      - name: Publish to releases branch (direct links)
        working-directory: app
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@tfjl.local"
          git fetch origin releases || true
          git checkout releases 2>/dev/null || git checkout --orphan releases
          git rm -rf . 2>/dev/null || true
          mv build/app/outputs/flutter-apk/app-release.apk tfjl-android-v${{ steps.ver.outputs.version }}.apk
          mv tfjl-assistant-ios-unsigned.ipa tfjl-ios-v${{ steps.ver.outputs.version }}.ipa
          DATE=$(date '+%Y-%m-%d %H:%M')
          printf '# APP 安装包\n\n- 更新时间: %s\n- tfjl-android.apk —— 安卓直接安装\n- tfjl-ios-unsigned.ipa —— iPhone 用爱思助手/AltStore 自签安装\n' "$DATE" > README.md
          git add -f tfjl-android-v*.apk tfjl-ios-v*.ipa README.md
          git commit -m "packages $DATE" || true
          git push origin releases --force
