name: Build App (APK + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/build-app.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry tfjl-assistant-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la tfjl-assistant-ios-unsigned.ipa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: tfjl-assistant-ios-unsigned
          path: app/tfjl-assistant-ios-unsigned.ipa

      - name: Publish to releases branch (direct links)
        working-directory: app
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@tfjl.local"
          git fetch origin releases || true
          git checkout releases 2>/dev/null || git checkout --orphan releases
          git rm -rf . 2>/dev/null || true
          mv build/app/outputs/flutter-apk/app-release.apk tfjl-android.apk
          mv tfjl-assistant-ios-unsigned.ipa tfjl-ios-unsigned.ipa
          DATE=$(date '+%Y-%m-%d %H:%M')
          printf '# APP 安装包\n\n- 更新时间: %s\n- tfjl-android.apk —— 安卓直接安装\n- tfjl-ios-unsigned.ipa —— iPhone 用爱思助手/AltStore 自签安装\n' "$DATE" > README.md
          git add -f tfjl-android.apk tfjl-ios-unsigned.ipa README.md
          git commit -m "packages $DATE" || true
          git push origin releases --force
