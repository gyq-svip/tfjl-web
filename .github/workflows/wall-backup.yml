name: Wall Backup (需求墙定时备份)

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京时间每天 04:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '干跑（只读不写，验证流程）'
        type: boolean
        default: false
      force:
        description: '强制备份（忽略指纹增量判定）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run wall backup
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          KEEP_DAYS: '10'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node .github/scripts/wall-backup.mjs
