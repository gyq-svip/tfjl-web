name: Diag Aggregate (诊断数据定时聚合)

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟（北京时间无固定偏移，GitHub 用 UTC，但 10 分钟粒度不受影响）
  workflow_dispatch:         # 允许手动触发验证

permissions:
  contents: read            # 脚本用 GIST_TOKEN 写 Gist，不碰仓库写权限

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run diag aggregate
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node .github/scripts/diag-aggregate.mjs
