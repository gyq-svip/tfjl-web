name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug - Check files
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking HTML files..."
          for file in *.html; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            fi
          done

      - name: Inject Token (optional)
        run: |
          TOKEN="${{ secrets.GIST_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "⚠️ GIST_TOKEN 未设置，跳过注入（前端将回退到 parent.getGistToken()）"
            exit 0
          fi
          echo "Injecting GitHub Token..."
          for file in *.html; do
            if grep -q "YOUR_GITHUB_TOKEN_HERE" "$file"; then
              sed -i "s/YOUR_GITHUB_TOKEN_HERE/$TOKEN/g" "$file"
              echo "✅ Token injected into $file"
            fi
          done
          echo "Token injection completed"

      - name: Verify Injection (optional)
        run: |
          TOKEN="${{ secrets.GIST_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "ℹ️ 无 GIST_TOKEN，跳过注入校验"
            exit 0
          fi
          echo "Verifying token injection..."
          ALL_OK=true
          for file in *.html; do
            if grep -q "YOUR_GITHUB_TOKEN_HERE" "$file"; then
              echo "❌ ERROR: Token was NOT injected in $file!"
              ALL_OK=false
            else
              echo "✅ SUCCESS: Token verified in $file"
            fi
          done
          if [ "$ALL_OK" = false ]; then
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
