name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug - Check files
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking HTML files..."
          for file in *.html; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
              if grep -q "YOUR_GITHUB_TOKEN_HERE" "$file"; then
                echo "  ✅ Token placeholder found in $file"
              else
                echo "  ℹ️ No token placeholder in $file (may not need it)"
              fi
            fi
          done

      - name: Debug - Check secret
        run: |
          echo "Checking GIST_TOKEN secret..."
          if [ -n "${{ secrets.GIST_TOKEN }}" ]; then
            echo "✅ GIST_TOKEN secret exists"
            echo "Token length: ${#GIST_TOKEN}"
            echo "Token prefix: ${GIST_TOKEN:0:10}"
          else
            echo "❌ GIST_TOKEN secret is empty!"
            exit 1
          fi

      - name: Inject Token
        run: |
          echo "Injecting GitHub Token..."
          
          # 读取Token
          TOKEN="${{ secrets.GIST_TOKEN }}"
          
          # 对所有HTML文件进行Token替换
          for file in *.html; do
            if grep -q "YOUR_GITHUB_TOKEN_HERE" "$file"; then
              sed -i "s/YOUR_GITHUB_TOKEN_HERE/$TOKEN/g" "$file"
              echo "✅ Token injected into $file"
            fi
          done
          
          echo "Token injection completed"

      - name: Verify Injection
        run: |
          echo "Verifying token injection..."
          ALL_OK=true
          for file in *.html; do
            if grep -q "YOUR_GITHUB_TOKEN_HERE" "$file"; then
              echo "❌ ERROR: Token was NOT injected in $file!"
              ALL_OK=false
            else
              echo "✅ SUCCESS: Token verified in $file"
            fi
          done
          if [ "$ALL_OK" = false ]; then
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
