name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 只把「网页真正需要的文件」拷进 _site 后再上传。
      # 历史问题：原先 upload-pages-artifact 用 path: '.'，会把整个仓库
      # （6 个 exe 安装包约 27MB + projects/ 9.7MB + src-tauri/ + vendor/ + webroot/）
      # 全量打包，artifact 过大导致 Set up job 阶段超时失败，
      # 结果 2026-08-06 之后线上一直停留在旧版本。改为白名单后 artifact 仅几 MB。
      - name: Stage site files
        run: |
          set -e
          mkdir -p _site

          # 页面
          cp -v *.html _site/ 2>/dev/null || true
          # 禁用 Jekyll 处理（否则含特殊字符 · 的文件名在 Pages CDN 上间歇 404）
          touch _site/.nojekyll

          # 模块化脚本 + 样式 + Service Worker
          cp -v app-*.js _site/ 2>/dev/null || true
          cp -v color-picker.js _site/ 2>/dev/null || true
          cp -v recognize.js skins-web.js gh-gist.js github-config.js _site/ 2>/dev/null || true
          cp -v styles.css sw.js _site/ 2>/dev/null || true

          # 阶段2 懒加载器 + 模块清单
          cp -v loader.js modules.manifest.json _site/ 2>/dev/null || true

          # 更新元数据（App 更新器读取）
          cp -v updater.json version.json _site/ 2>/dev/null || true

          # 第三方库 & 皮肤资源 & 脚本目录
          [ -d vendor ]  && cp -rv vendor  _site/ || true
          [ -d skins ]   && cp -rv skins   _site/ || true
          [ -d scripts ] && cp -rv scripts _site/ || true
          # 默认项目（深海-王城低配版，支持皮肤；ensureDefaultProjectLoaded 启动时拉取）
          [ -d projects ] && cp -rv projects _site/ || true

          echo "=== staged size ==="
          du -sh _site
          echo "=== top-level entries ==="
          ls -la _site

      - name: Bump asset version (cache-bust per deploy)
        run: |
          VER="b$(date +%Y%m%d%H%M%S)"
          echo "Cache-bust version: $VER"
          # 把 _site/index.html 里所有脚本 src 的 ?v= 查询参数替换为部署时间戳，
          # 确保 Service Worker(staleWhileRevalidate) 每次部署都按新 URL 拉到最新 JS，不再跑旧缓存。
          sed -i -E 's/(<script[^>]*src="[^"]*)\?v=[^"]*(")/\1?v='"$VER"'\2/g' _site/index.html
          echo "--- script tags after bump ---"
          grep -nE '<script[^>]*src="[^"]*\.js' _site/index.html || true

      - name: Inject deploy marker (visible version tag)
        run: |
          # 每次部署自动把页面右下角 #versionTag 更新为「部署日期序号 · 当前 SW 版本号」，
          # 与项目既有的 s1.0.xxx 语义版本风格一致（用户看得懂、可对照 SW 缓存/脚本 ?v= 判断最新）。
          # 例：s20260824-01 · s1.0.230
          DATEPART="s$(date +%Y%m%d)"
          # 从 sw.js 读取当前 CACHE_VERSION（如 s1.0.230）
          SWVER=$(grep -oE "CACHE_VERSION = '[^']+'" _site/sw.js 2>/dev/null | head -1 | sed -E "s/CACHE_VERSION = '([^']+)'/\1/" || echo "s1.0.0")
          MARKER="$DATEPART-$(date +%H%M) · $SWVER"
          # 替换 <span id="versionTag" ...>旧的静态标记</span> 内的文本
          sed -i -E 's/(<span id="versionTag"[^>]*>)[^<]*(<\/span>)/\1'"$MARKER"'\2/' _site/index.html
          # 同步 title 属性（悬浮提示显示的短文本），避免残留旧值
          sed -i -E 's/(<span id="versionTag"[^>]*title=")[^"]*(")/\1'"$MARKER"'\2/' _site/index.html
          echo "Deploy marker injected: $MARKER"
          grep -nE 'id="versionTag"' _site/index.html || true

      - name: Inject Token (optional)
        run: |
          TOKEN="${{ secrets.GIST_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "⚠️ GIST_TOKEN 未设置，跳过注入（前端将回退到 parent.getGistToken()）"
            exit 0
          fi
          echo "Injecting GitHub Token..."
          # 注意：之前只注入 _site/*.html，但模块化后 getGistToken() 已移到 app-core.js(JS 文件)，
          # 导致线上 app-core.js 的 HARDCODED_TOKEN 占位符从未被替换 → getGistToken() 返回空 →
          # 需求墙/分享等写 Gist 功能误报“离线版”。现改为注入所有含占位符的文件（含 js）。
          grep -rl "YOUR_GITHUB_TOKEN_HERE" _site/ 2>/dev/null | while read -r file; do
            sed -i "s/YOUR_GITHUB_TOKEN_HERE/$TOKEN/g" "$file"
            echo "✅ Token injected into $file"
          done
          echo "Token injection completed"

      - name: Verify staged site
        run: |
          set -e
          MISSING=false
          for f in index.html sw.js styles.css app-core.js app-features.js loader.js color-picker.js; do
            if [ ! -f "_site/$f" ]; then
              echo "❌ ERROR: 缺少关键文件 _site/$f"
              MISSING=true
            else
              echo "✅ _site/$f"
            fi
          done
          if [ "$MISSING" = true ]; then exit 1; fi

          # 确保没有 exe 混进来
          if find _site -name '*.exe' | grep -q .; then
            echo "❌ ERROR: _site 中混入了 exe 安装包"
            find _site -name '*.exe'
            exit 1
          fi
          echo "✅ 无 exe 混入"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
