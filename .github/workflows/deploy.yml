name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 只把「网页真正需要的文件」拷进 _site 后再上传。
      # 历史问题：原先 upload-pages-artifact 用 path: '.'，会把整个仓库
      # （6 个 exe 安装包约 27MB + projects/ 9.7MB + src-tauri/ + vendor/ + webroot/）
      # 全量打包，artifact 过大导致 Set up job 阶段超时失败，
      # 结果 2026-08-06 之后线上一直停留在旧版本。改为白名单后 artifact 仅几 MB。
      - name: Stage site files
        run: |
          set -e
          mkdir -p _site

          # 页面
          cp -v *.html _site/ 2>/dev/null || true
          # 禁用 Jekyll 处理（否则含特殊字符 · 的文件名在 Pages CDN 上间歇 404）
          touch _site/.nojekyll

          # 模块化脚本 + 样式 + Service Worker
          cp -v app-*.js _site/ 2>/dev/null || true
          cp -v admin-ctl.js _site/ 2>/dev/null || true
          cp -v color-picker.js _site/ 2>/dev/null || true
          cp -v recognize.js skins-web.js gh-gist.js github-config.js _site/ 2>/dev/null || true
          cp -v styles.css sw.js _site/ 2>/dev/null || true

          # 阶段2 懒加载器 + 模块清单
          cp -v loader.js modules.manifest.json _site/ 2>/dev/null || true

          # 更新元数据（App 更新器读取）
          cp -v updater.json version.json _site/ 2>/dev/null || true
          # 皮肤包索引（客户端据此得知当前有效包名，再从 Gitee 发行版拉取对应皮肤包）
          cp -v skins-index.json _site/ 2>/dev/null || true

          # 第三方库 & 皮肤资源 & 脚本目录
          [ -d vendor ]  && cp -rv vendor  _site/ || true
          [ -d skins ]   && cp -rv skins   _site/ || true
          [ -d scripts ] && cp -rv scripts _site/ || true
          # 默认项目（深海-王城低配版，支持皮肤；ensureDefaultProjectLoaded 启动时拉取）
          [ -d projects ] && cp -rv projects _site/ || true

          echo "=== staged size ==="
          du -sh _site
          echo "=== top-level entries ==="
          ls -la _site

      - name: Bump asset version (cache-bust per deploy)
        run: |
          VER="b$(date +%Y%m%d%H%M%S)"
          echo "Cache-bust version: $VER"
          # 把 _site/index.html 里所有脚本 src 的 ?v= 查询参数替换为部署时间戳，
          # 确保 Service Worker(staleWhileRevalidate) 每次部署都按新 URL 拉到最新 JS，不再跑旧缓存。
          sed -i -E 's/(<script[^>]*src="[^"]*)\?v=[^"]*(")/\1?v='"$VER"'\2/g' _site/index.html
          echo "--- script tags after bump ---"
          grep -nE '<script[^>]*src="[^"]*\.js' _site/index.html || true

          # 🔴 同步更新右下角版本号前半段「发布时间」为部署时的北京时间（避免一直显示旧的写死日期如 20260823）
          # 用 Asia/Shanghai 时区，确保显示的日期与用户本地一致（runner 默认 UTC 会少一天）
          DEPLOY_TAG="s$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "Deploy tag (Beijing): $DEPLOY_TAG"
          sed -i -E "s/(id=\"versionTag\"[^>]*>)[s0-9-]{11,16}/\1${DEPLOY_TAG}/g" _site/index.html
          sed -i -E "s/(<div class=\"version-tooltip\">版本 )[s0-9-]{11,16}/\1${DEPLOY_TAG}/g" _site/index.html
          grep -nE 'id="versionTag"' _site/index.html || true

          # 🔴 修复「SW 版本号每次部署不变」：自增 sw.js 的 CACHE_VERSION（与桌面端 lib.rs 同逻辑 +1），
          # 让 SW 缓存命名空间每次部署都变 → 旧 SW 控制的缓存强制失效，浏览器拉到最新前端。
          # 直接改仓库根 sw.js（checkout 的工作区），稍后 commit-back 到 main，保证下次部署基于新值继续 +1（持续累加）。
          python3 - <<'PY'
          import re, os, subprocess
          # 部署北京日期（脚本内自算，避免依赖 shell 变量跨 step 传递）
          deploy_tag = 's' + subprocess.getoutput('TZ=Asia/Shanghai date +%Y%m%d-%H%M').strip()
          print('DEPLOY_TAG for sw.js inject:', deploy_tag)
          for p in ['sw.js', '_site/sw.js']:
              try:
                  s = open(p, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              def inc(m):
                  return m.group(1) + str(int(m.group(2)) + 1) + m.group(3)
              s2 = re.sub(r"(CACHE_VERSION = 's1\.0\.)(\d+)(')", inc, s)
              # 注入/替换 DEPLOY_TAG 常量（紧跟 CACHE_VERSION），让 SW_VERSION 消息能携带部署日期到页面
              # 彻底解决「版本号日期消失」——之前依赖 HTML 文本 split/CDN 缓存的 window.__DEPLOY_TAG 都会失效
              if re.search(r"const DEPLOY_TAG = '[^']*'", s2):
                  s2 = re.sub(r"const DEPLOY_TAG = '[^']*';", f"const DEPLOY_TAG = '{deploy_tag}';", s2)
              else:
                  s2 = re.sub(r"(const CACHE_VERSION = '[^']+';)", r"\1\nconst DEPLOY_TAG = '" + deploy_tag + "';", s2, count=1)
              open(p, 'w', encoding='utf-8').write(s2)
              print('bumped CACHE_VERSION + DEPLOY_TAG in', p, '→', deploy_tag)
          # 同步 version.json 的 frontVersion（方案B：前端真实版本源，供 app-picker.js 比对 + 标签填充）
          # 必须和 sw.js CACHE_VERSION 同源自增，否则下次部署前端版本(471)与 version.json(470)对不上 → 比对失效。
          # 🔴 2026-08-30 关键修复：旧版只写仓库根目录 version.json，而第 50 行早已把【旧】version.json 拷进 _site/
          #    → 线上部署的 version.json 永远没有 frontVersion/deployTag → 前端比对只能回退解析 HTML（不稳定）
          #    → 升级气泡误报。现在【根目录 + _site】两份都写，线上版本源彻底可靠。
          import json
          vj_path = 'version.json'
          try:
              vj = json.load(open(vj_path, encoding='utf-8'))
          except Exception:
              vj = {}
          # 取 sw.js 已经自增后的 CACHE_VERSION 作为 frontVersion 基值
          m = re.search(r"CACHE_VERSION = '(s1\.0\.\d+)'", open('sw.js', encoding='utf-8').read())
          front_ver = m.group(1) if m else vj.get('frontVersion', 's1.0.470')
          vj['frontVersion'] = front_ver
          vj['deployTag'] = deploy_tag
          for p in ['version.json', '_site/version.json']:
              json.dump(vj, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('synced version.json frontVersion →', front_ver, 'deployTag →', deploy_tag, '(root + _site)')
          PY

          # 🔴 2026-08-26 已废弃：原逻辑用 sed 把 register('./sw.js') 改成 register('./sw.js?v=b时间戳')，
          # 但 app-picker.js 已改为 register('./sw.js?v=' + #versionTag base)（跟随部署版本，更稳），
          # 字面 './sw.js' 不再存在 → sed 匹配不到 → 这两行现在是死代码。保留注释备查，避免以后误解。
          # sed -i -E "s#(navigator\.serviceWorker\.register\(\s*')\./sw\.js(')#\1./sw.js?v=$VER\2#g" _site/app-picker.js || true
          # sed -i -E "s#(navigator\.serviceWorker\.register\(\s*')\./sw\.js(')#\1./sw.js?v=$VER\2#g" app-picker.js || true
          # grep -nE "register\('\.?/?sw\.js" _site/app-picker.js || true
          echo "SW register cachebust 已由 app-picker.js 跟随 #versionTag 处理，CI sed 已废弃（跳过）"

      - name: Inject deploy marker (visible version tag)
        run: |
          # 每次部署自动把页面右下角 #versionTag 更新为「部署日期序号 · 当前 SW 版本号」，
          # 与项目既有的 s1.0.xxx 语义版本风格一致（用户看得懂、可对照 SW 缓存/脚本 ?v= 判断最新）。
          # 日期部分复用上面第 75 行算好的 DEPLOY_TAG（已用 Asia/Shanghai 时区，避免少一天），
          # 不再单独用 UTC 的 date 重算，彻底修复「版本号前半段显示 UTC 日期(少一天)」的问题。
          # 从 sw.js 读取当前 CACHE_VERSION（如 s1.0.230）
          SWVER=$(grep -oE "CACHE_VERSION = '[^']+'" _site/sw.js 2>/dev/null | head -1 | sed -E "s/CACHE_VERSION = '([^']+)'/\1/" || echo "s1.0.0")
          MARKER="$DEPLOY_TAG · $SWVER"
          # 替换右下角版本号 <span id="versionTag" ...>旧的静态标记</span> 内的文本
          sed -i -E 's/(<span id="versionTag"[^>]*>)[^<]*(<\/span>)/\1'"$MARKER"'\2/' _site/index.html
          # 注入确定性部署日期到 window.__DEPLOY_TAG（页面运行时优先用它回填版本号日期段，
          # 避免依赖 HTML versionTag 文本 split 在旧缓存 HTML 下取到空导致「日期消失」）
          sed -i -E "s#(</head>)#<script>window.__DEPLOY_TAG='$DEPLOY_TAG';</script>\n\1#" _site/index.html
          echo "Deploy marker injected: $MARKER"
          grep -nE 'id="versionTag"' _site/index.html || true


      - name: Inject Token (optional)
        run: |
          TOKEN="${{ secrets.GIST_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "⚠️ GIST_TOKEN 未设置，跳过注入（前端将回退到 parent.getGistToken()）"
            exit 0
          fi
          echo "Injecting GitHub Token..."
          # 注意：之前只注入 _site/*.html，但模块化后 getGistToken() 已移到 app-core.js(JS 文件)，
          # 导致线上 app-core.js 的 HARDCODED_TOKEN 占位符从未被替换 → getGistToken() 返回空 →
          # 需求墙/分享等写 Gist 功能误报“离线版”。现改为注入所有含占位符的文件（含 js）。
          grep -rl "YOUR_GITHUB_TOKEN_HERE" _site/ 2>/dev/null | while read -r file; do
            sed -i "s/YOUR_GITHUB_TOKEN_HERE/$TOKEN/g" "$file"
            echo "✅ Token injected into $file"
          done
          echo "Token injection completed"

      - name: Verify staged site
        run: |
          set -e
          MISSING=false
          for f in index.html sw.js styles.css app-core.js app-features.js loader.js color-picker.js; do
            if [ ! -f "_site/$f" ]; then
              echo "❌ ERROR: 缺少关键文件 _site/$f"
              MISSING=true
            else
              echo "✅ _site/$f"
            fi
          done
          if [ "$MISSING" = true ]; then exit 1; fi

          # 确保没有 exe 混进来
          if find _site -name '*.exe' | grep -q .; then
            echo "❌ ERROR: _site 中混入了 exe 安装包"
            find _site -name '*.exe'
            exit 1
          fi
          echo "✅ 无 exe 混入"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit back bumped sw.js CACHE_VERSION (so next deploy continues +1)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 仅提交 sw.js 的 CACHE_VERSION 自增 + app-picker.js 的 SW 注册 ?v= 时间戳（保持源码与部署一致）
          # 🔴 2026-08-30：version.json 的 frontVersion 也要提交回来，否则下次部署基于旧值，
          #    根目录 version.json 与线上脱节 → 远端版本比对永远对不上。
          git add sw.js app-picker.js version.json
          if git diff --cached --quiet; then
            echo "sw.js 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(ci): bump sw.js CACHE_VERSION [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
